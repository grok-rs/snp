# crate-ci/typos configuration.

[files]
extend-exclude = [
    "Cargo.lock",
    "deps.lock",
    # Research corpora quote third-party sources, byte strings and generated vectors verbatim.
    "docs/research/**",
    "crates/*/src/generated/**",
    "crates/*/tests/vectors/**",
    "tests/differential/scenarios/**",
    # Generated from the research documents (titles quote them verbatim).
    "tests/catalog/index.tsv",
    # Recorded upstream outputs, oracle goldens and real-world corpora: verbatim third-party bytes.
    "crates/*/testdata/**",
    "crates/*/tests/goldens/**",
    "crates/snp-hooks/tests/*/goldens/**",
    "crates/snp-hooks/tests/*/cases.json",
    "crates/snp-hooks/tests/caveats/corpus/**",
    "crates/snp-migrate/tests/fixtures/**",
    # Pixel-art rows (letters are colours).
    "docs/assets/src/pixel_logo.py",
]

[default]
extend-ignore-re = [
    # hex digests and object ids
    "[0-9a-f]{12,}",
    # escaped byte strings
    "\\\\x[0-9a-fA-F]{2}",
    # abbreviation glosses of short names: `s(cenario)`, `v(alue)`
    "\\b[a-z]\\([a-z]+\\)",
    # a line that misspells on purpose (an invalid value, a substring) says so
    "(?m)^.*spellchecker:disable-line.*$",
]

[default.extend-words]
# Python / pre-commit vocabulary
fo = "fo"
ba = "ba"
nd = "nd"
ue = "ue"
ser = "ser"
dne = "dne"
mis = "mis"
caf = "caf"
flate = "flate"
unparseable = "unparseable"
# the hax verification toolchain (ADR-095, docs/VERIFICATION.md §14)
hax = "hax"
# Upstream texts snp reproduces verbatim: pre-commit-hooks' help typos (`Maxmimum` before v4.1.0, `contstructs`
# before v4.5.0), its `path_splitted` variable, node's LTS codename `Jod`
Maxmimum = "Maxmimum"
contstructs = "contstructs"
splitted = "splitted"
Jod = "Jod"
# Unicode / CPython identifiers in the pycompat oracle scripts
TIO = "TIO"
PN = "PN"
