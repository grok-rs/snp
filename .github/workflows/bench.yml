# Performance and memory gates (WP-36; ARCHITECTURE §12.3, ADR-043, ADR-071, ADR-079). Owned by WP-36.
#
# * micro:  criterion micro-benches (`cargo bench -p snp`) + `cargo xtask bench gate --micro` (the exact W1/W2
#           thresholds; the perf-smoke tests of ci.yml only catch a 3x regression).
# * e2e:    hyperfine scenarios B1-B12 of snp (dist) vs pre-commit 4.7.0 (pc470-py312) and prek 0.5.10 on the Linux
#           reference runner. Pull requests and pushes to main also build the base commit (the PR base, or the commit
#           before the push) at base/snp, against its own deps.lock crates (base/cfgv-rs, base/file-identify) and its
#           own toolchain, with its own stores; `bench run --base-snp` measures the two binaries in interleaved ABBA
#           rounds per scenario, pre-commit and prek right after, and the gate pairs the rounds (ADR-099). Every event
#           counts clones, statx, newfstatat, opens, dirents and execs with strace (`--counts`); with a base, clones,
#           statx and newfstatat are gated against it and the exec argv diff is in the comment (ADR-100). Pull
#           requests get a PR comment. The JSON-lines history is reported, never gated (`--advisory-history`,
#           ADR-090); all but pull requests append to it. The nightly also enforces the syscall ceilings
#           (`strace -f -c`, B1 <= 64), the B3 allocation budget and B8's heap peak (dhat, ADR-100).
# * musl:   B3/B4/B6/B12 of the musl artifact with the system allocator and with mimalloc (ADR-079); the adopted
#           allocator (bench/budgets.toml [musl]) is held to the never-slower-than-prek rule.
#
# Every scenario runs; a miss accepted for now is a `[[known_miss]]` of bench/budgets.toml, with its reason (ADR-091).
# MUSL_PENDING lists the scenarios outside the musl matrix (ADR-079: B3/B4/B6/B12), whose budgets warn
# (`--allow-missing`): a scenario in neither list fails every hard budget it has.
#
# The history caches of the gnu (e2e) and musl jobs use prefixes that cannot match each other: actions/cache
# restore-keys are prefix matches, and a shared prefix would restore the other job's history.
name: bench

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deps.lock"
      - "bench/**"
      - "xtask/src/tasks/bench.rs"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  BENCH_SCENARIOS: B1,B2,B3,B4,B5,B6,B7,B8,B9,B10,B11,B12u
  MUSL_SCENARIOS: B1,B3,B4,B6,B12u
  MUSL_PENDING: B2,B5,B7,B8,B9,B10,B11

defaults:
  run:
    shell: bash
    working-directory: snp

jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp, key: bench-micro }
      - name: criterion micro-benches
        run: >-
          echo "BENCH_START=$(date +%s)" >> "$GITHUB_ENV" &&
          cargo bench -p snp --locked
          --bench argparse_hook_impl --bench len_cjk --bench pyre_kinds
          --bench shuffle_partition --bench tagging_tiers --bench yaml_manifest_load
          -- --noplot
      - name: micro thresholds
        run: cargo xtask bench gate --micro --since "$BENCH_START"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion
          path: snp/target/criterion
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp, key: bench-e2e }
      - uses: astral-sh/setup-uv@v6
      - name: strace
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -yq strace
      - run: cargo xtask oracle install
      - name: Bench history
        uses: actions/cache/restore@v4
        with:
          path: snp/bench/history
          key: bench-history-gnu-${{ github.run_id }}
          restore-keys: bench-history-gnu-
      # rust-cache restores target/ and its cleanup leaves the bench work state there incomplete (a mirror without
      # HEAD, tool stores whose repos lost files), which broke setup and the reference pre-commit's install-hooks on
      # PR runs. Only base-target is a cargo cache worth keeping; setup rebuilds the rest.
      - name: Fresh bench work state
        run: find target/bench -mindepth 1 -maxdepth 1 ! -name base-target -exec rm -rf {} + 2>/dev/null || true
      - run: cargo xtask bench setup --scenarios "$BENCH_SCENARIOS"
      # Pull requests and pushes: the base commit's snp (the PR base, or the commit before the push), built on this
      # runner like the head (ADR-099): checked out at base/snp, its own deps.lock crates next to it (base/cfgv-rs,
      # base/file-identify, so its `../cfgv-rs` paths resolve to them), its own rust-toolchain.toml and .cargo, and
      # `--locked`. A baseline from the history comes from another VM, and runner variance alone exceeds the 5 %
      # regression threshold on millisecond scenarios (B1: +57 % for an identical binary), which is why the history
      # is only reported.
      - name: Base commit
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base/snp
      - name: Build the base commit
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: |
          .github/scripts/deps-lock.sh checkout ../base/snp/deps.lock
          if ! cmp -s deps.lock ../base/snp/deps.lock; then
            echo "The base builds against other user-crate revisions:"
            diff deps.lock ../base/snp/deps.lock || true
          fi
          if ! cmp -s rust-toolchain.toml ../base/snp/rust-toolchain.toml; then
            echo "The base builds with another toolchain:"
            diff rust-toolchain.toml ../base/snp/rust-toolchain.toml || true
          fi
          target="$GITHUB_WORKSPACE/snp/target/bench/base-target"
          (cd ../base/snp && rustup toolchain install && \
            cargo build --profile dist --locked -p snp --bin snp --target-dir "$target")
          echo "BASE_SNP=$target/dist/snp" >> "$GITHUB_ENV"
      - name: Setup
        run: |
          base=()
          if [ -n "${BASE_SNP:-}" ]; then base=(--base-snp "$BASE_SNP"); fi
          cargo xtask bench setup --scenarios "$BENCH_SCENARIOS" "${base[@]}"
      - name: Measure
        run: |
          extra=(--counts)
          if [ "${{ github.event_name }}" = schedule ]; then extra+=(--syscalls --dhat); fi
          if [ -n "${BASE_SNP:-}" ]; then extra+=(--base-snp "$BASE_SNP"); fi
          cargo xtask bench run --scenarios "$BENCH_SCENARIOS" --label current "${extra[@]}"
      # With a base, the record's paired rounds and counters gate; the history (other VMs) is advisory either way.
      - name: Gate
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            cargo xtask bench gate --advisory-history --comment target/bench/comment.md
          else
            cargo xtask bench gate --advisory-history --comment target/bench/comment.md --record
          fi
      - name: Job summary
        if: always()
        run: if [ -f target/bench/comment.md ]; then cat target/bench/comment.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f target/bench/comment.md ] || exit 0
          gh pr comment "$PR" --body-file target/bench/comment.md --edit-last \
            || gh pr comment "$PR" --body-file target/bench/comment.md
      - name: Save the bench history
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: snp/bench/history
          key: bench-history-gnu-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-e2e
          path: |
            snp/target/bench/results
            snp/target/bench/comment.md
            snp/bench/history
          retention-days: 30

  musl:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - name: musl toolchain
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp, key: bench-musl }
      - uses: astral-sh/setup-uv@v6
      - run: cargo xtask oracle install
      - name: Bench history
        uses: actions/cache/restore@v4
        with:
          path: snp/bench/history
          key: bench-history-musl-${{ github.run_id }}
          restore-keys: bench-history-musl-
      # rust-cache restores target/ and its cleanup leaves the bench work state there incomplete (a mirror without
      # HEAD, tool stores whose repos lost files), which broke setup and the reference pre-commit's install-hooks on
      # PR runs. Only base-target is a cargo cache worth keeping; setup rebuilds the rest.
      - name: Fresh bench work state
        run: find target/bench -mindepth 1 -maxdepth 1 ! -name base-target -exec rm -rf {} + 2>/dev/null || true
      - run: cargo xtask bench setup --scenarios "$MUSL_SCENARIOS" --target x86_64-unknown-linux-musl
      - name: Measure both allocators
        run: |
          for alloc in system mimalloc; do
            cargo xtask bench run --scenarios "$MUSL_SCENARIOS" --target x86_64-unknown-linux-musl \
              --allocator "$alloc" --label "musl-$alloc"
          done
      - name: Allocator effect (ADR-079)
        run: |
          cargo xtask bench gate --compare target/bench/results/musl-system.json target/bench/results/musl-mimalloc.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gate
        run: |
          for alloc in system mimalloc; do
            cargo xtask bench gate --current "target/bench/results/musl-$alloc.json" --advisory-history --record \
              --allow-missing "$MUSL_PENDING"
          done
      - name: Save the bench history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: snp/bench/history
          key: bench-history-musl-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-musl
          path: snp/target/bench/results
          retention-days: 30
