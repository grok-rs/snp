# Lean models (ADR-095, docs/VERIFICATION.md §7). Owned by WP-00.
#
# The `lean` job is ADVISORY: it is not a required check, so a red run does not block a merge; it becomes required
# under ADR-095 (11) (4 green weeks on main, p95 under 5 min, the owner's approval). The proof guards and Verus
# (`cargo xtask proofs check`, `cargo xtask proofs verus`) are blocking steps of the required `xtask gates` job of
# ci.yml since the owner's M1-exit decision (ADR-096), which replaced this workflow's former advisory `verus` job;
# the nightly `proofs-*` jobs of nightly.yml check the models against CPython and sweep Z3 seeds.
#
# The job always starts and exits early when no relevant path changed: an `on.paths` filter would leave a check that
# is later made required pending forever. Layout as in ci.yml: the repository at $GITHUB_WORKSPACE/snp, the user
# crates next to it at the deps.lock commits.
name: proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash
    working-directory: snp

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, fetch-depth: 0 }
      - name: Relevant change?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The registry, the Lake package, the home crates of the oracle tests, and the tooling itself.
          crates="$(sed -n 's|^oracle_test = "\(crates/[^/]*/\).*|\1|p' proofs/registry.toml | sort -u | paste -sd'|' -)"
          pattern="^(proofs/registry[.]toml|proofs/lean/|xtask/src/tasks/proofs|[.]github/workflows/proofs[.]yml${crates:+|$crates})"
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No model-relevant change: nothing to check."
          fi
      - name: User crates at the deps.lock commits
        if: steps.paths.outputs.run == 'true'
        run: .github/scripts/deps-lock.sh checkout
      # leanprover/lean-action v1.7.1: installs elan and the toolchain of proofs/lean/lean-toolchain, builds with
      # --wfail (a `sorry` is only a warning otherwise). Its own axiom-audit and leanchecker steps stay off: they derive
      # the module name from the package name ("Snpmodels", not SnpModels) and find no oleans. `cargo xtask proofs lean`
      # below runs both on the right module (L2, L3).
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        if: steps.paths.outputs.run == 'true'
        with:
          lake-package-directory: snp/proofs/lean
          build-args: --wfail
          test: false
          lint: false
          axiom-audit: false
          leanchecker: false
          use-mathlib-cache: false
      - if: steps.paths.outputs.run == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.paths.outputs.run == 'true'
        with: { workspaces: snp, key: proofs-lean }
      - uses: taiki-e/install-action@v2
        if: steps.paths.outputs.run == 'true'
        with: { tool: cargo-nextest }
      - name: Lean (L1-L5)
        if: steps.paths.outputs.run == 'true'
        run: cargo xtask proofs lean
      - name: Oracle tests (SNP_REQUIRE_LEAN_ORACLES=1)
        if: steps.paths.outputs.run == 'true'
        run: cargo xtask proofs oracles
