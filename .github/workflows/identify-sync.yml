name: identify sync

# Weekly: regenerate the tables (src/generated.rs) from the latest Python
# identify release on PyPI. When they changed, also regenerate the parity
# vectors by running that identify release, test, and open (or update) a
# pull request on the `identify-sync` branch for review. By hand:
#   src="$(xtask/fetch-identify.sh latest /tmp/identify)"
#   cargo xtask gen-identify --src "$src"
#   python3 -I xtask/parity/gen_vectors.py --identify "$(dirname "$src")" \
#     --out tests/data/identify-vectors.json
#
# Pull requests opened with the default GITHUB_TOKEN do not trigger other
# workflows (CI). Store a fine-grained token with "contents" and "pull
# requests" write access as the IDENTIFY_SYNC_TOKEN secret to get CI on the
# pull request, or close and reopen it.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identify-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sync:
    name: Sync with latest identify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # The vectors are defined by CPython 3.12's os.path / shlex behaviour.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Download the latest identify wheel (verified by sha256, not installed)
      id: fetch
      run: |
        src="$(xtask/fetch-identify.sh latest "$RUNNER_TEMP/identify")"
        echo "src=$src" >> "$GITHUB_OUTPUT"

    - name: Regenerate the tables
      id: tables
      env:
        SRC: ${{ steps.fetch.outputs.src }}
      run: |
        cargo xtask gen-identify --src "$SRC"
        version="$(sed -n 's/^pub const IDENTIFY_VERSION: &str = "\(.*\)";$/\1/p' src/generated.rs)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git diff --quiet -- src/generated.rs; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "src/generated.rs already matches identify $version"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat -- src/generated.rs
        fi

    # Only on drift, so that a newer Python patch release alone never opens a
    # pull request. This imports and runs identify from the verified wheel,
    # in isolated mode.
    - name: Regenerate the parity vectors
      if: steps.tables.outputs.changed == 'true'
      env:
        SRC: ${{ steps.fetch.outputs.src }}
      run: |
        python3 -I xtask/parity/gen_vectors.py --identify "$(dirname "$SRC")" \
          --out tests/data/identify-vectors.json

    - name: Test
      id: test
      if: steps.tables.outputs.changed == 'true'
      # The pull request is opened either way; its body reports the result.
      continue-on-error: true
      run: cargo test --all-features

    - name: Open or update the pull request
      if: steps.tables.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.IDENTIFY_SYNC_TOKEN || github.token }}
        branch: identify-sync
        delete-branch: true
        add-paths: |
          src/generated.rs
          tests/data/identify-vectors.json
        commit-message: "feat: sync tables with identify ${{ steps.tables.outputs.version }}"
        title: "Sync tables with identify ${{ steps.tables.outputs.version }}"
        body: |
          Regenerated `src/generated.rs` with `cargo xtask gen-identify` from the identify
          ${{ steps.tables.outputs.version }} wheel on PyPI (sha256-verified), and
          `tests/data/identify-vectors.json` by running that release.

          `cargo test --all-features` on the regenerated tree: **${{ steps.test.outcome }}**.

          Before merging: review the table diff, update tag counts and the identify
          version in README.md, CHANGELOG.md and the docs, and release.
