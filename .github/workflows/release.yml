# Release (WBS WP-37; ADR-049, ADR-061; ARCHITECTURE §11.7; 07 §3.17). Owned by WP-37.
#
# Maintained by hand in the layout of cargo-dist 0.32's generated workflow (dist-workspace.toml has
# `allow-dirty = ["ci"]`), with the snp specifics:
#
# * every job checks the repository out at $GITHUB_WORKSPACE/snp and the user crates next to it at the deps.lock
#   commits (ADR-061), so `../cfgv-rs` and `../file-identify` resolve;
# * `gates` runs first: `cargo xtask release gates` (deps.lock pins exactly the user crates; the siblings are clean at
#   the pinned commits; the snp checkout is clean; the tag is `v` + the workspace version with a CHANGELOG section;
#   cfgv and file-identify are published on crates.io from exactly the pinned commits, `.cargo_vcs_info.json`; the
#   crates.io publish set is pinned and self-contained, ADR-088), then `cargo publish --workspace --dry-run` packages
#   and builds every published crate against the registry. A mismatch stops the release before anything is built;
# * `dist` builds the eight targets with cargo-auditable, a CycloneDX SBOM per package and SHA-256 checksums, plus the
#   shell and PowerShell installers and the Homebrew formula `snp.rb` (no bin-aliases);
# * `wheels` builds the snp-cli wheels with maturin (bindings = "bin") and smoke-tests them;
# * `announce` attests every asset (GitHub artifact attestations) and creates the GitHub release with the CHANGELOG
#   section as notes; `publish-pypi` uploads the wheels with trusted publishing (before the release);
#   `publish-crates` (`cargo publish`, CARGO_REGISTRY_TOKEN) and `publish-homebrew` (Formula/snp.rb in
#   grok-rs/homebrew-tap, HOMEBREW_TAP_DEPLOY_KEY) run after it (ADR-088). Pre-releases skip all three channels.
#
# Triggers: a pushed tag `vX.Y.Z` releases. A pull request that changes the release configuration, and a manual run
# with the default tag `dry-run`, run the gates (without the registry check), the crates.io dry run, `dist plan` and
# the builds, but publish nothing.
#
# Runners: the arm64 Linux and Windows runners exist for public repositories only. While the repository is private a
# dry run builds the other targets (the dist matrix and the wheel matrix drop the arm64 Linux/Windows entries, as
# platform.yml does) and a tagged release fails in `gates` with an explanation, instead of leaving jobs queued.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - dist-workspace.toml
      - .github/workflows/release.yml
      - .github/scripts/publish-crates.sh
      - packaging/pypi/**
      - xtask/src/tasks/release.rs
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z), or dry-run to build without publishing
        required: true
        default: dry-run
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DIST_VERSION: "0.32.0"
  MATURIN_VERSION: "1.15.0"

defaults:
  run:
    shell: bash
    working-directory: snp

jobs:
  gates:
    name: release gates (ADR-061)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publishing: ${{ steps.tag.outputs.publishing }}
      private: ${{ steps.runners.outputs.private }}
      wheels: ${{ steps.runners.outputs.wheels }}
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - name: Release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        # A manual release must be dispatched from the tag itself ("Use workflow from: Tags / vX.Y.Z"): every job
        # checks out the dispatch ref, and actions/checkout fetches neither tags nor other refs, so a run dispatched
        # from a branch would build the branch. Refused here with an explanation instead of failing in the gate.
        run: |
          tag=""
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_TAG" != dry-run ]; then
            tag="$INPUT_TAG"
            if [ "$REF" != "refs/tags/$tag" ]; then
              echo "::error::a manual release of $tag must be dispatched from the tag $tag (Use workflow from: Tags / $tag), not from $REF"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "publishing=true" >> "$GITHUB_OUTPUT"; else echo "publishing=false" >> "$GITHUB_OUTPUT"; fi
      - name: Runners (arm64 Linux/Windows runners exist for public repositories only)
        id: runners
        env:
          PRIVATE: ${{ github.event.repository.private }}
          PUBLISHING: ${{ steps.tag.outputs.publishing }}
        run: |
          wheels='[
            {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04","manylinux":"2_17","smoke":true},
            {"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","manylinux":"2_17","smoke":true},
            {"target":"x86_64-unknown-linux-musl","runner":"ubuntu-24.04","manylinux":"musllinux_1_2","smoke":false},
            {"target":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm","manylinux":"musllinux_1_2","smoke":false},
            {"target":"aarch64-apple-darwin","runner":"macos-15","manylinux":"","smoke":true},
            {"target":"x86_64-apple-darwin","runner":"macos-15-intel","manylinux":"","smoke":true},
            {"target":"x86_64-pc-windows-msvc","runner":"windows-2025","manylinux":"","smoke":true},
            {"target":"aarch64-pc-windows-msvc","runner":"windows-11-arm","manylinux":"","smoke":true}
          ]'
          if [ "$PRIVATE" = true ]; then
            if [ "$PUBLISHING" = true ]; then
              echo "::error::a release needs the arm64 Linux and Windows runners, which exist for public repositories only; make the repository public first"
              exit 1
            fi
            echo "::notice::private repository: the dry run skips the arm64 Linux and Windows targets"
            wheels="$(jq -c 'map(select(.runner != "ubuntu-24.04-arm" and .runner != "windows-11-arm"))' <<< "$wheels")"
            echo "private=true" >> "$GITHUB_OUTPUT"
          else
            wheels="$(jq -c . <<< "$wheels")"
            echo "private=false" >> "$GITHUB_OUTPUT"
          fi
          echo "wheels=$wheels" >> "$GITHUB_OUTPUT"
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - name: cargo xtask release gates
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            cargo xtask release gates --tag "$TAG"
          else
            # dry runs and pull requests: the user crates need not be published yet, the version not be released
            cargo xtask release gates --skip-registry --allow-unreleased
          fi
      # ADR-088: every crate of the publish set packages and builds on its own against crates.io (cargo resolves
      # the not-yet-published ones from the packages it just made), before anything is built or published.
      - name: crates.io dry run
        run: cargo publish --workspace --dry-run --locked
      - name: Release notes
        if: steps.tag.outputs.publishing == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: cargo xtask release notes "$TAG"

  plan:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      targets: ${{ steps.plan.outputs.targets }}
      tag-flag: ${{ needs.gates.outputs.tag != '' && format('--tag={0}', needs.gates.outputs.tag) || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - name: Install dist
        working-directory: .
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Cache dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        env:
          TAG: ${{ needs.gates.outputs.tag }}
          PRIVATE: ${{ needs.gates.outputs.private }}
        run: |
          if [ -n "$TAG" ]; then
            dist plan --tag="$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          if [ "$PRIVATE" = true ]; then
            # dry run in a private repository (gates refuses a release there): no arm64 Linux/Windows runners
            jq '.ci.github.artifacts_matrix.include |= map(select(.runner != "ubuntu-24.04-arm" and .runner != "windows-11-arm"))' \
              plan-dist-manifest.json > plan-filtered.json
            mv plan-filtered.json plan-dist-manifest.json
          fi
          echo "targets=$(jq -r '[.ci.github.artifacts_matrix.include[]?.targets[]] | join(" ")' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: snp/plan-dist-manifest.json

  build-local-artifacts:
    name: build (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Neutral git defaults
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - name: Install dist
        working-directory: .
        # dist's plan gives the installer command for its shell (`pwsh` on Windows: `irm … | iex`).
        env:
          INSTALL_DIST: ${{ matrix.install_dist.run }}
          INSTALL_DIST_SHELL: ${{ matrix.install_dist.shell }}
        run: |
          if [ "$INSTALL_DIST_SHELL" = pwsh ]; then
            pwsh -NoProfile -Command "$INSTALL_DIST"
          else
            sh -c "$INSTALL_DIST"
          fi
      - name: Install cargo-auditable, cargo-cyclonedx and rust-audit-info
        uses: taiki-e/install-action@v2
        with: { tool: "cargo-auditable,cargo-cyclonedx,rust-audit-info" }
      - name: Install system dependencies
        if: ${{ matrix.packages_install }}
        run: ${{ matrix.packages_install }}
      - name: Build artifacts
        id: dist
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          # relative paths are relative to snp/ (the working directory), artifact paths to the workspace
          jq --raw-output ".upload_files[]" dist-manifest.json | sed -E '/^(\/|[A-Za-z]:)/! s|^|snp/|' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          mkdir -p target/distrib
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Each target's archive is unpacked and its binary's embedded dependency list read back with rust-audit-info
      # (which parses the `.dep-v0` section of ELF, Mach-O and PE files and decompresses it): it must be valid JSON
      # whose root package is snp. A missing archive, binary or section is an error.
      - name: The binaries embed their dependency list (cargo-auditable)
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          for t in $TARGETS; do
            dir="$RUNNER_TEMP/auditable-$t"
            rm -rf "$dir" && mkdir -p "$dir"
            case "$t" in
              *windows*)
                archive="target/distrib/snp-$t.zip"; exe=snp.exe
                test -f "$archive" || { echo "::error::missing $archive"; exit 1; }
                7z x -y -o"$dir" "$archive" > /dev/null ;;
              *)
                archive="target/distrib/snp-$t.tar.xz"; exe=snp
                test -f "$archive" || { echo "::error::missing $archive"; exit 1; }
                tar -xJf "$archive" -C "$dir" ;;
            esac
            bin="$(find "$dir" -type f -name "$exe" | head -n 1)"
            [ -n "$bin" ] || { echo "::error::$archive contains no $exe"; exit 1; }
            rust-audit-info "$bin" > "$dir/audit.json" \
              || { echo "::error::$t: $exe has no readable .dep-v0 section (cargo-auditable)"; exit 1; }
            jq -e 'any(.packages[]; .name == "snp" and .root == true) and (.packages | length) > 1' "$dir/audit.json" > /dev/null \
              || { echo "::error::$t: the dependency list of $exe does not have snp as its root package"; exit 1; }
            echo "$t: $exe embeds its dependency list ($(jq '.packages | length' "$dir/audit.json") packages)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.dist.outputs.paths }}
            snp/${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs: [gates, plan, build-local-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: actions/download-artifact@v4
        with: { name: cargo-dist-cache, path: ~/.cargo/bin/ }
      - run: chmod +x ~/.cargo/bin/dist
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with: { tool: cargo-cyclonedx }
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: snp/target/distrib/
          merge-multiple: true
      - id: dist
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          # relative paths are relative to snp/ (the working directory), artifact paths to the workspace
          jq --raw-output ".upload_files[]" dist-manifest.json | sed -E '/^(\/|[A-Za-z]:)/! s|^|snp/|' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # dist lists the SBOM as a global artifact (target/distrib/snp.cdx.xml) but does not write it: its own CI template
      # runs cargo-cyclonedx in this job. cargo-cyclonedx writes one SBOM per workspace member next to its manifest;
      # only the binary package's is released, and it covers the dependencies of every target.
      - name: CycloneDX SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --format xml --target all --manifest-path crates/snp/Cargo.toml
          mv crates/snp/snp.cdx.xml target/distrib/snp.cdx.xml
          find . -path ./target -prune -o -name '*.cdx.xml' -type f -exec rm -f '{}' +
      # every target of the plan: all eight for a release, without the arm64 Linux/Windows ones for a private dry run
      - name: Every target has an archive, a checksum and an SBOM
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          PRIVATE: ${{ needs.gates.outputs.private }}
        run: |
          set -euo pipefail
          n="$(wc -w <<< "$TARGETS")"
          if [ "$PRIVATE" != true ] && [ "$n" -ne 8 ]; then echo "::error::the plan has $n targets, not 8: $TARGETS"; exit 1; fi
          for t in $TARGETS; do
            case "$t" in *windows*) a="snp-$t.zip" ;; *) a="snp-$t.tar.xz" ;; esac
            test -f "target/distrib/$a" || { echo "::error::missing $a"; exit 1; }
            test -f "target/distrib/$a.sha256" || { echo "::error::missing $a.sha256"; exit 1; }
          done
          ls target/distrib
          # the SBOM's path comes from the global manifest's upload list (the step above writes it there)
          sbom="$(jq --raw-output '.upload_files[]' dist-manifest.json | grep -E '\.cdx\.xml$' | head -n 1)"
          [ -n "$sbom" ] && [ -f "$sbom" ] || { echo "::error::no CycloneDX SBOM (upload list: $sbom)"; exit 1; }
          test -f target/distrib/snp-installer.sh && test -f target/distrib/snp-installer.ps1
      # ADR-088: the Homebrew formula publish-homebrew commits to the tap. It is valid Ruby, has this release's
      # version and a checksum per archive URL, and installs `snp` only: no `pre-commit` alias (ADR-049).
      - name: The Homebrew formula installs snp only
        env:
          PRIVATE: ${{ needs.gates.outputs.private }}
        run: |
          set -euo pipefail
          f=target/distrib/snp.rb
          jq --raw-output '.upload_files[]' dist-manifest.json | grep -Eq '(^|/)snp\.rb$' \
            || { echo "::error::snp.rb is not in the global upload list"; exit 1; }
          test -f "$f" || { echo "::error::missing $f"; exit 1; }
          ruby -c "$f"
          version="$(jq --raw-output '.releases[] | select(.app_name == "snp") | .app_version' dist-manifest.json)"
          grep -Fq "version \"$version\"" "$f" || { echo "::error::snp.rb does not say version $version"; exit 1; }
          urls="$(grep -Ec '^\s*url "' "$f" || true)"
          sums="$(grep -Ec '^\s*sha256 "[0-9a-f]{64}"' "$f" || true)"
          echo "snp.rb: $urls archive URLs, $sums checksums"
          [ "$urls" -eq 4 ] || { echo "::error::snp.rb has $urls archive URLs, not 4 (macOS and Linux x arm64/x86_64)"; exit 1; }
          # a private dry run builds no arm64 Linux archive, so that URL has no checksum
          if [ "$PRIVATE" != true ] && [ "$sums" -ne "$urls" ]; then echo "::error::snp.rb has $sums checksums for $urls URLs"; exit 1; fi
          # (the description names pre-commit; nothing else may)
          if grep -v '^\s*desc "' "$f" | grep -n 'pre-commit'; then
            echo "::error::snp.rb mentions pre-commit outside its description (ADR-049: no alias)"; exit 1
          fi
          if grep -E '^\s*"[^"]+": \{[^}]' "$f"; then echo "::error::snp.rb installs binary aliases"; exit 1; fi
          if grep -E '^\s*bin\.install ' "$f" | grep -vE '^\s*bin\.install "snp"$'; then
            echo "::error::snp.rb installs something besides snp"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.dist.outputs.paths }}
            snp/${{ env.BUILD_MANIFEST_NAME }}

  wheels:
    # snp-cli (ADR-049, 11 §A.9.3): maturin `bindings = "bin"`, the `snp` binary only. Linux wheels are manylinux
    # 2_17 builds made in maturin's container (the whole workspace, siblings included, is mounted); Windows wheels link
    # the CRT statically like the archives.
    name: wheel (${{ matrix.target }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        # the eight targets (gates drops the arm64 Linux/Windows ones for a dry run in a private repository)
        include: ${{ fromJson(needs.gates.outputs.wheels) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - name: Static CRT on Windows
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: snp/packaging/pypi
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --locked --out dist
          sccache: false
      - uses: astral-sh/setup-uv@v6
        if: ${{ matrix.smoke }}
      - name: Install the wheel and run snp --version
        if: ${{ matrix.smoke }}
        working-directory: snp/packaging/pypi
        run: |
          uv venv --python 3.13 venv
          if [ "$RUNNER_OS" = Windows ]; then bin=venv/Scripts; else bin=venv/bin; fi
          # `--python` takes the environment directory (a bare `venv/Scripts/python` has no `.exe` to find).
          uv pip install --python venv dist/snp_cli-*.whl
          # Windows prints `\r\n` (Python text-mode stdout, which snp reproduces).
          "$bin/snp" --version | tr -d '\r' | tee version.txt
          grep -Eq '^snp [0-9]+\.[0-9]+\.[0-9]+$' version.txt
          if ls "$bin" | grep -qi '^pre-commit'; then echo "::error::the wheel installed a pre-commit executable"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: snp/packaging/pypi/dist

  host:
    needs: [gates, plan, build-local-artifacts, build-global-artifacts, wheels]
    if: ${{ always() && needs.gates.outputs.publishing == 'true' && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.wheels.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - uses: actions/download-artifact@v4
        with: { name: cargo-dist-cache, path: ~/.cargo/bin/ }
      - run: chmod +x ~/.cargo/bin/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: snp/target/distrib/
          merge-multiple: true
      - id: host
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          # shellcheck disable=SC2086
          dist host $TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-dist-manifest
          path: snp/dist-manifest.json

  publish-pypi:
    name: publish snp-cli to PyPI
    needs: [plan, host]
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://pypi.org/project/snp-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          attestations: true

  announce:
    needs: [gates, plan, host, publish-pypi]
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-pypi.result == 'skipped' || needs.publish-pypi.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { path: snp, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: artifacts
          merge-multiple: true
      - name: Remove the per-job manifests
        working-directory: .
        run: rm -f artifacts/*-dist-manifest.json
      - name: Attest every asset
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - name: Create the GitHub release
        working-directory: .
        env:
          TAG: ${{ needs.gates.outputs.tag }}
          PRERELEASE_FLAG: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease && '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(needs.host.outputs.val).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(needs.host.outputs.val).announcement_github_body }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # ADR-088: `cargo install snp` (and the internal crates it needs) once the GitHub release exists. Re-runnable: the
  # crates whose version is already on crates.io are skipped (a re-run after a partial failure publishes the rest;
  # `cargo publish` alone refuses an existing version), and crates.io's rate limit for new crates (a first release
  # creates every crate) is waited out. See .github/scripts/publish-crates.sh.
  publish-crates:
    name: publish to crates.io
    needs: [gates, plan, announce]
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    runs-on: ubuntu-24.04
    # a first release creates 23 crates: past crates.io's burst, about one new crate per ten minutes
    timeout-minutes: 330
    environment:
      name: release
      url: https://crates.io/crates/snp
    steps:
      - uses: actions/checkout@v4
        with:
          path: snp
          ref: ${{ needs.gates.outputs.tag }}
          persist-credentials: false
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - name: cargo publish
        env:
          TAG: ${{ needs.gates.outputs.tag }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish-crates.sh "${TAG#v}"

  # ADR-088: `brew install grok-rs/tap/snp`. dist's formula (built and checked by build-global-artifacts, released as
  # an asset) is committed to the tap as Formula/snp.rb with the tap's deploy key. Not for pre-releases.
  publish-homebrew:
    name: publish the Homebrew formula
    needs: [gates, plan, announce]
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { name: artifacts-build-global, path: global }
      - name: Commit Formula/snp.rb to grok-rs/homebrew-tap
        env:
          TAG: ${{ needs.gates.outputs.tag }}
          TAP: grok-rs/homebrew-tap
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          formula="$PWD/global/snp.rb"
          test -f "$formula" || { echo "::error::the global artifacts have no snp.rb"; exit 1; }
          ruby -c "$formula"
          grep -Fq "version \"$version\"" "$formula" || { echo "::error::snp.rb is not version $version"; exit 1; }
          [ -n "$DEPLOY_KEY" ] || { echo "::error::the HOMEBREW_TAP_DEPLOY_KEY secret is not set"; exit 1; }
          ssh_dir="$RUNNER_TEMP/tap-ssh"
          rm -rf "$ssh_dir" && mkdir -m 700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key")
          # github.com's SSH host keys from the API (over TLS), never trust-on-first-use
          curl --proto '=https' --tlsv1.2 -fsS https://api.github.com/meta \
            | jq --raw-output '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          git clone --depth 1 "git@github.com:$TAP.git" tap
          mkdir -p tap/Formula
          cp "$formula" tap/Formula/snp.rb
          cd tap
          git add Formula/snp.rb
          if git diff --cached --quiet; then
            echo "Formula/snp.rb already is snp $version"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "snp $version"
          git push origin HEAD
          echo "pushed snp $version to $TAP"
