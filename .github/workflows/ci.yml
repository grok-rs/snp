# CI (WBS WP-00 item 8; ARCHITECTURE §1.3, §13.7). Owned by WP-00.
#
# Layout: the repository is checked out at $GITHUB_WORKSPACE/snp and the user crates cfgv-rs and file-identify
# next to it at the commits pinned in deps.lock (ADR-061), so the path dependencies `../cfgv-rs` and
# `../file-identify` resolve. Every job does that first. The toolchain comes from rust-toolchain.toml (1.99.0).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash
    working-directory: snp

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp }
      # ARCHITECTURE §1.3: the full deny set on library and binary code ...
      - name: clippy (lib, bins)
        run: cargo clippy --workspace --all-features --lib --bins --locked -- -D warnings
      # ... and test code with assert*!/arithmetic relaxed.
      - name: clippy (tests, benches, examples)
        run: >-
          cargo clippy --workspace --all-features --tests --benches --examples --locked --
          -D warnings -A clippy::disallowed_macros -A clippy::arithmetic_side_effects
      - name: rustdoc
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-machete }
      - run: cargo machete

  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - uses: taiki-e/install-action@v2
        with: { tool: typos }
      - run: typos

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp, key: msrv }
      - run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

  xtask:
    name: xtask gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp }
      - run: cargo xtask check-dag
      - run: cargo xtask check-unsafe
      - run: cargo xtask lint-guards
      - run: cargo xtask catalog-index --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      # Test binaries locate snp / snp-probe through snp_testkit::Bins (ARCHITECTURE §1.2).
      - run: cargo build --workspace --bins --features snp/testing --locked
      - run: cargo nextest run --workspace --features snp/testing --locked --profile ci --no-tests=warn
      - run: cargo test --workspace --doc --locked

  perf-smoke:
    # Release-mode threshold tests: `#[test] #[ignore = "perf"]`, named `perf_*`, 3x safety factor (ADR-071).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: snp, key: perf }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: >-
          cargo nextest run --workspace --cargo-profile release --locked --profile ci
          --run-ignored only -E 'test(/perf_/)' --no-tests=pass

  fuzz-smoke:
    # 60 s per target (ARCHITECTURE §13.5): no panic, no hang > 5 s, <= 512 MB RSS, 256 KiB thread stacks.
    name: fuzz smoke (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      RUSTFLAGS: ""
      RUST_MIN_STACK: "262144"
    steps:
      - uses: actions/checkout@v4
        with: { path: snp }
      - name: User crates at the deps.lock commits
        run: .github/scripts/deps-lock.sh checkout
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      - name: Run this shard's targets for 60 s each
        run: |
          targets=$(cargo +nightly fuzz list)
          i=0
          for t in $targets; do
            if [ $((i % 6)) -eq ${{ matrix.shard }} ]; then
              echo "::group::$t"
              cargo +nightly fuzz run "$t" -- -max_total_time=60 -timeout=5 -rss_limit_mb=512
              echo "::endgroup::"
            fi
            i=$((i + 1))
          done
