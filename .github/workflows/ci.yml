name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.85 is the MSRV (`rust-version` in Cargo.toml; edition 2024).
        toolchain: [stable, "1.85"]
        features: [--all-features, --no-default-features, ""]
    env:
      # rust-toolchain.toml pins `stable`; RUSTUP_TOOLCHAIN takes precedence,
      # so the MSRV job really builds with the MSRV.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: rustc --version && cargo --version
      - run: cargo test ${{ matrix.features }}

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
      - run: cargo doc --no-deps --no-default-features

  fuzz:
    name: Fuzz (smoke run)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz needs nightly; rust-toolchain.toml pins stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run every target for 60 seconds
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60 -max_len=4096
          done

  vectors:
    name: Python parity vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate from the cfgv 3.5.0 wheel and CPython 3.12
        run: |
          work="$RUNNER_TEMP/parity"
          mkdir -p "$work/download" "$work/cfgv" "$work/vectors"
          python -m pip download cfgv==3.5.0 --no-deps --only-binary=:all: -d "$work/download"
          python -I -c 'import glob, sys, zipfile; zipfile.ZipFile(glob.glob(sys.argv[1] + "/cfgv-3.5.0-*.whl")[0]).extract("cfgv.py", sys.argv[2])' "$work/download" "$work/cfgv"
          cd "$work"
          python -I "$GITHUB_WORKSPACE/scripts/gen_parity_vectors.py" cfgv vectors
          python -I "$GITHUB_WORKSPACE/scripts/gen_unicode_tables.py" tables.rs
          diff -r "$GITHUB_WORKSPACE/tests/vectors" vectors
          diff "$GITHUB_WORKSPACE/src/py/tables.rs" tables.rs
