# Generated by `snp migrate lefthook` from lefthook.yml
minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [commit-msg, pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      # snp-migrate: lossy: pre-commit/eslint: stage_fixed dropped (portable mode): fixes are no longer staged
      - id: eslint
        name: eslint
        language: system
        entry: yarn eslint --fix
        files: '^(?i:(?:.*\.(?:js|ts)))$'
        stages: [pre-commit]
        require_serial: true
      # snp-migrate: warning: pre-commit/rubocop: exclude 'config/routes.rb' is matched from the repo root (lefthook semantics) and never matches under root 'backend/'
      # snp-migrate: lossy: pre-commit/rubocop: tags dropped (portable mode)
      - id: rubocop
        name: rubocop
        language: system
        entry: sh -c 'cd backend || exit 1; RUBOCOP_OPTS="--parallel"; export RUBOCOP_OPTS; for f in "$@"; do set -- "$@" "${f#backend/}"; shift; done; bundle exec rubocop -A --force-exclusion -- "$@"' --
        files: '^(?=backend/)(?i:(?:.*\.rb))$'
        exclude: '^(?:config/routes\.rb)$'
        stages: [pre-commit]
        require_serial: true
      # snp-migrate: lossy: commit-msg/lint-msg: skip/only conditions dropped (portable mode)
      - id: lint-msg
        name: lint-msg
        language: system
        entry: npx commitlint --edit
        stages: [commit-msg]
        require_serial: true
      # snp-migrate: lossy: pre-push/test: fail_text dropped (portable mode)
      # snp-migrate: lossy: pre-push/test: timeout dropped (portable mode)
      - id: test
        name: test
        language: system
        entry: yarn test
        pass_filenames: false
        stages: [pre-push]
