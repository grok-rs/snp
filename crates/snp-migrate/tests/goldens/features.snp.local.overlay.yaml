# Generated by `snp migrate lefthook --local` from lefthook-local.yml
# Personal overrides for snp (never read by pre-commit); add this file to .gitignore.
hooks:
  all-python:
    entry: "sh -c 'set -f; IFS='\\''\n'\\''; set -- $( ( git ls-files --cached ) | grep -iE '\\''^(.*\\.py)$'\\'' | grep -vE '\\''^(vendor/.*)$'\\'' | while IFS= read -r f; do [ -f \"$f\" ] && printf '\\''%s\\n'\\'' \"$f\"; done); unset IFS; set +f; [ $# -gt 0 ] || exit 0; docker compose run --rm app ruff check \"$@\"' --"
  3-fast:
    skip: true
repos:
  - repo: local
    hooks:
      - id: personal
        name: personal
        language: system
        entry: echo personal
        exclude: '^(?:vendor/.*)$'
        pass_filenames: false
        stages: [pre-commit]
        priority: 0
