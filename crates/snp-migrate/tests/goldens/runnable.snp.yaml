# Generated by `snp migrate lefthook` from lefthook.yml
fail_on_changes: never   # snp-migrate: lefthook default; pre-commit semantics would fail modified files
default_install_hook_types: [commit-msg, post-checkout, pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: text-files-are-not-empty
        name: text files are not empty
        language: system
        entry: grep -q .
        files: '^(?i:(?:.*\.txt))$'
        stages: [pre-commit]
        require_serial: true
        priority: 0
        stage_fixed: true
        fail_text: add some text
        timeout: 30s
      - id: wrapper
        name: wrapper
        language: system
        entry: sh -c 'wc -l "$@" > /dev/null && echo counted' --
        exclude: '^(?:.*\.md)$'
        stages: [pre-commit]
        require_serial: true
        priority: 0
      - id: env-with-expansion
        name: env with expansion
        language: system
        entry: sh -c 'GREETING="hel${NOTHING}lo"; export GREETING; test "$GREETING" = hello' --
        pass_filenames: false
        stages: [pre-commit]
        priority: 0
      - id: in-a-root
        name: in a root
        language: system
        entry: 'true'
        pass_filenames: false
        stages: [pre-commit]
        priority: 0
        root: sub
        skip: [merge]
      # snp-migrate: warning: pre-commit/listed files: best-effort: file list computed in shell
      - id: listed-files
        name: listed files
        language: system
        entry: "sh -c 'set -f; IFS='\\''\n'\\''; set -- $( ( git ls-files ) | grep -iE '\\''^(.*\\.txt)$'\\'' | while IFS= read -r f; do [ -f \"$f\" ] && printf '\\''%s\\n'\\'' \"$f\"; done); unset IFS; set +f; [ $# -gt 0 ] || exit 0; grep -q . \"$@\"' --"
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        fail_fast: true
        priority: 0
      - id: ok-sh
        name: ok.sh
        language: system
        entry: sh .lefthook/pre-commit/ok.sh
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        priority: 0
      # snp-migrate: warning: pre-commit/every file: best-effort: file list computed in shell
      - id: every-file
        name: every file
        language: system
        entry: "sh -c 'set -f; IFS='\\''\n'\\''; set -- $( ( git ls-files --cached ) | while IFS= read -r f; do [ -f \"$f\" ] && printf '\\''%s\\n'\\'' \"$f\"; done); unset IFS; set +f; [ $# -gt 0 ] || exit 0; ls \"$@\" > /dev/null' --"
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        fail_fast: true
        priority: 10
        groups: [slow]
      - id: message
        name: message
        language: system
        entry: grep -q .
        stages: [commit-msg]
        require_serial: true
      - id: refs
        name: refs
        language: system
        entry: sh -c 'test -n "$PRE_COMMIT_FROM_REF" && test -n "$PRE_COMMIT_CHECKOUT_TYPE"' --
        pass_filenames: false
        always_run: true
        stages: [post-checkout]
      - id: remote
        name: remote
        language: system
        entry: sh -c 'test -n "$PRE_COMMIT_REMOTE_NAME"' --
        pass_filenames: false
        stages: [pre-push]
      - id: all
        name: all
        language: system
        entry: echo lint
        pass_filenames: false
        always_run: true
        stages: [manual]
        groups: [lint]
