# Generated by `snp migrate lefthook` from lefthook.yml, extends/e1.yml, extends/e2.yml, extends/e3.yml
fail_on_changes: never   # snp-migrate: lefthook default; pre-commit semantics would fail modified files
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: echo
        name: echo
        language: system
        entry: echo 2
        files: '^(?i:(?:3))$'
        pass_filenames: false
        stages: [pre-commit]
        groups: [backend]
        skip: true
      - id: echo
        name: echo
        language: system
        entry: e1
        pass_filenames: false
        always_run: true
        stages: [manual]
        groups: [e1]
      - id: echo-2
        name: echo
        language: system
        entry: e2
        pass_filenames: false
        always_run: true
        stages: [manual]
        groups: [e2]
      - id: echo-3
        name: echo
        language: system
        entry: e3
        pass_filenames: false
        always_run: true
        stages: [manual]
        groups: [e3]
