# Generated by `snp migrate lefthook` from lefthook.yml
minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [commit-msg, post-checkout, pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      # snp-migrate: lossy: pre-commit/text files are not empty: fail_text dropped (portable mode)
      # snp-migrate: lossy: pre-commit/text files are not empty: timeout dropped (portable mode)
      # snp-migrate: lossy: pre-commit/text files are not empty: stage_fixed dropped (portable mode): fixes are no longer staged
      - id: text-files-are-not-empty
        name: text files are not empty
        language: system
        entry: grep -q .
        files: '^(?i:(?:.*\.txt))$'
        stages: [pre-commit]
        require_serial: true
      - id: wrapper
        name: wrapper
        language: system
        entry: sh -c 'wc -l "$@" > /dev/null && echo counted' --
        exclude: '^(?:.*\.md)$'
        stages: [pre-commit]
        require_serial: true
      - id: env-with-expansion
        name: env with expansion
        language: system
        entry: sh -c 'GREETING="hel${NOTHING}lo"; export GREETING; test "$GREETING" = hello' --
        pass_filenames: false
        stages: [pre-commit]
      # snp-migrate: lossy: pre-commit/in a root: skip/only conditions dropped (portable mode)
      - id: in-a-root
        name: in a root
        language: system
        entry: sh -c 'cd sub || exit 1; true' --
        files: '^sub/'
        pass_filenames: false
        stages: [pre-commit]
      # snp-migrate: warning: pre-commit/listed files: best-effort: file list computed in shell (names git must quote are skipped)
      - id: listed-files
        name: listed files
        language: system
        entry: "sh -c 'set -f; IFS='\\''\n'\\''; set -- $( ( [ -n \"${GIT_CONFIG_COUNT-}\" ] || export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.quotePath GIT_CONFIG_VALUE_0=false; git ls-files ) | sed '\\''s/^[[:space:]]*//; s/[[:space:]]*$//'\\'' | grep -iE '\\''^(.*\\.txt)$'\\'' | while IFS= read -r f; do [ -f \"$f\" ] && printf '\\''%s\\n'\\'' \"$f\"; done); unset IFS; set +f; [ $# -gt 0 ] || exit 0; grep -q . \"$@\"' --"
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        fail_fast: true
      - id: ok-sh
        name: ok.sh
        language: system
        entry: sh .lefthook/pre-commit/ok.sh
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # snp-migrate: warning: pre-commit/every file: best-effort: file list computed in shell (names git must quote are skipped)
      # snp-migrate: lossy: pre-commit/every file: tags dropped (portable mode)
      - id: every-file
        name: every file
        language: system
        entry: "sh -c 'set -f; IFS='\\''\n'\\''; set -- $( ( [ -n \"${GIT_CONFIG_COUNT-}\" ] || export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.quotePath GIT_CONFIG_VALUE_0=false; git ls-files --cached ) | sed '\\''s/^[[:space:]]*//; s/[[:space:]]*$//'\\'' | while IFS= read -r f; do [ -f \"$f\" ] && printf '\\''%s\\n'\\'' \"$f\"; done); unset IFS; set +f; [ $# -gt 0 ] || exit 0; ls \"$@\" > /dev/null' --"
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        fail_fast: true
      - id: message
        name: message
        language: system
        entry: grep -q .
        stages: [commit-msg]
        require_serial: true
      - id: refs
        name: refs
        language: system
        entry: sh -c 'test -n "$PRE_COMMIT_FROM_REF" && test -n "$PRE_COMMIT_CHECKOUT_TYPE"' --
        pass_filenames: false
        always_run: true
        stages: [post-checkout]
      - id: remote
        name: remote
        language: system
        entry: sh -c 'test -n "$PRE_COMMIT_REMOTE_NAME"' --
        pass_filenames: false
        stages: [pre-push]
      - id: all
        name: all (lint)
        language: system
        entry: echo lint
        pass_filenames: false
        always_run: true
        stages: [manual]
