[package]
name = "snp-core"
description = "snp vocabulary: stages, languages, brand, Env/EnvPatch, CancelToken, Failure envelope, Printer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ADR-088: published to crates.io; the package carries the sources only (tests, vectors and benches stay in
# the repository).
include = ["/src/"]

[dependencies]
snp-pycompat.workspace = true

# tests/pty.rs: a real pseudo-terminal for the line-buffering acceptance item (WBS WP-00).
[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[features]
# Test-only panic-injection points (ADR-066); enabled by crates/snp's `testing` feature only.
fault-injection = []

[lints]
workspace = true
