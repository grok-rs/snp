[package]
name = "snp-hooks"
description = "Native hooks: framework, pygrep, fail, hazmat, builtin variants and pre-commit-hooks ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
snp-argparse.workspace = true
snp-cli.workspace = true
snp-core.workspace = true
snp-git.workspace = true
snp-hooks-data.workspace = true
snp-os.workspace = true
snp-proc.workspace = true
snp-pycompat.workspace = true
snp-pyparsers.workspace = true
snp-pyre.workspace = true
cfgv.workspace = true
file-identify.workspace = true
# Byte scanning for the P1/P2/caveat natives (WP-27; anchored in src/pch/{p1,p2,caveats}/mod.rs). WP-26 owns
# this manifest and adds any further dependency WP-27 requests (docs/WBS.md, "Integration-lead files").
bstr.workspace = true
memchr.workspace = true

[target.'cfg(unix)'.dependencies]
# `__hazmat` dies by the signal that interrupted it (03 Addendum §H.8.7).
signal-hook.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

# Path H (`__hazmat`) is a process of its own: the test binary re-executes itself as that process, so it owns
# `main` (03 Addendum §H.8.9).
[[test]]
name = "hazmat"
path = "tests/hazmat/main.rs"
harness = false

[lints]
workspace = true
