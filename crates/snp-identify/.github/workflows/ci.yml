name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --locked
    - run: cargo test --locked --all-features

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.85.0
    - uses: Swatinem/rust-cache@v2
    # `+1.85.0` makes sure no toolchain file or default overrides the MSRV.
    - run: cargo +1.85.0 test --locked --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  generated:
    name: Generated tables match identify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Regenerate from the pinned identify release and compare
      run: |
        version="$(sed -n 's/^pub const IDENTIFY_VERSION: &str = "\(.*\)";$/\1/p' src/generated.rs)"
        src="$(xtask/fetch-identify.sh "$version" "$RUNNER_TEMP/identify")"
        cargo xtask gen-identify --src "$src" --check

  fuzz:
    name: Fuzz (smoke, 30 s per target)
    runs-on: ubuntu-latest
    env:
      # What `cargo fuzz build --sanitizer none` passes; stable rustc accepts
      # these, and safe Rust needs no address sanitizer.
      RUSTFLAGS: >-
        -Cpasses=sancov-module
        -Cllvm-args=-sanitizer-coverage-level=4
        -Cllvm-args=-sanitizer-coverage-inline-8bit-counters
        -Cllvm-args=-sanitizer-coverage-pc-table
        -Cllvm-args=-sanitizer-coverage-trace-compares
        --cfg fuzzing
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: fuzz
    - name: Build the fuzz targets
      working-directory: fuzz
      run: cargo build --locked --release --target x86_64-unknown-linux-gnu
    - name: Run each target
      working-directory: fuzz
      run: |
        for target in shebang filename shlex classify; do
          mkdir -p "corpus/$target" "artifacts/$target"
          "target/x86_64-unknown-linux-gnu/release/$target" "corpus/$target" \
            -max_total_time=30 -max_len=4096 -artifact_prefix="artifacts/$target/"
        done
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings
