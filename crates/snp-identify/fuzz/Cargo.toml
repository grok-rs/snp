[package]
name = "file-identify-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for file-identify"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
file-identify = { path = ".." }

# Not a member of the file-identify workspace.
[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "shebang"
path = "fuzz_targets/shebang.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filename"
path = "fuzz_targets/filename.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shlex"
path = "fuzz_targets/shlex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false
bench = false
