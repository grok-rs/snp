[package]
name = "snp-identify"
description = "Python identify 2.6.20 for snp: file type tags from names, extensions, shebangs and content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["file", "identification", "filetype", "identify", "pre-commit"]
categories = ["filesystem", "development-tools"]
# ADR-088/ADR-116: published to crates.io with snp's =X.Y.Z release train; the package carries the sources, the
# README (compiled as doctests) and the license only (tests, vectors, benches and fuzz targets stay in the
# repository).
include = ["/src/", "/README.md", "/LICENSE"]

# ADR-116: absorbed from the standalone `file-identify` crate (0.5.0). The library keeps the name `file_identify`,
# so its users write `file_identify::` (the workspace dependency key is `file-identify`, `package = "snp-identify"`).
[lib]
name = "file_identify"

[[bench]]
name = "identify"
harness = false

[dependencies]
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
