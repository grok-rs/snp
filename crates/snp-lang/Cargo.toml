[package]
name = "snp-lang"
description = "Language trait, registry, shared helpers, CmdRunner seam and the 21 language backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
snp-core.workspace = true
snp-net.workspace = true
snp-os.workspace = true
snp-proc.workspace = true
snp-pycompat.workspace = true
blake3.workspace = true
flate2.workspace = true
md-5.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
# Node's Unix builds are `.tar.xz` (ARCHITECTURE §1.3: liblzma, feature `xz` of snp-net, Unix node tarballs only).
snp-net = { workspace = true, features = ["xz"] }

[target.'cfg(windows)'.dependencies]
# `ToolProbe::fingerprint`: the file index of an executable (`GetFileInformationByHandle`).
winapi-util.workspace = true

[features]
testing = []

[package.metadata.cargo-machete]
# md-5's library is named `md5` (`use md5` in src/common/); machete matches the package name.
ignored = ["md-5"]

[lints]
workspace = true
