[package]
name = "snp-pyre"
description = "CPython-3.12 `re` front end lowered to regex (tier 1) and fancy-regex (tier 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ADR-088: published to crates.io; the package carries the sources only (tests, vectors and benches stay in
# the repository).
include = ["/src/"]

[dependencies]
snp-core.workspace = true
snp-pycompat.workspace = true
fancy-regex.workspace = true
indexmap.workspace = true
memchr.workspace = true
regex.workspace = true
regex-syntax.workspace = true
unicode-ident.workspace = true
unicode_names2 = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
default = ["py-re-names"]
# `\N{name}` escapes (01 Addendum §A.5.4); without it they are rejected as `Unsupported` (§A.6.13 D3).
py-re-names = ["dep:unicode_names2"]

[lints]
workspace = true
