[package]
name = "snp-cmd"
description = "Non-run commands: install, uninstall, autoupdate, gc, clean, validate, doctor, self, cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ADR-088: published to crates.io; the package carries the sources only (tests, vectors and benches stay in
# the repository).
include = ["/src/"]

[dependencies]
snp-cli.workspace = true
snp-config.workspace = true
snp-core.workspace = true
snp-git.workspace = true
snp-hooks-data.workspace = true
snp-os.workspace = true
snp-proc.workspace = true
snp-pycompat.workspace = true
snp-pyre.workspace = true
snp-stash.workspace = true
snp-store.workspace = true
snp-yaml.workspace = true
blake3.workspace = true
memchr.workspace = true
tempfile.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
