[package]
name = "snp-yaml"
description = "PyYAML SafeLoader/SafeDumper compatibility over an in-tree libyaml port (ADR-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ADR-088: published to crates.io; the package carries the sources only (tests, vectors and benches stay in
# the repository).
include = ["/src/"]

[dependencies]
snp-core.workspace = true
snp-pycompat.workspace = true
cfgv.workspace = true
indexmap.workspace = true

[dev-dependencies]
# The oracle vectors (`tests/vectors/*.json`, generated by `cargo xtask yaml-vectors`) and the memory gate.
serde_json.workspace = true
dhat.workspace = true

[lints]
workspace = true
