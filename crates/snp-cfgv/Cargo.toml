[package]
name = "snp-cfgv"
description = "Python cfgv 3.5.0 for snp: validate configuration with byte-for-byte compatible error messages (internal crate of snp; no API stability promise, versions follow snp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["configuration", "validation", "schema", "cfgv", "pre-commit"]
categories = ["config", "development-tools"]
# ADR-088/ADR-116: published to crates.io with snp's =X.Y.Z release train; the package carries the sources, the
# README (compiled as doctests) and the license only (tests, vectors and fuzz targets stay in the repository).
include = ["/src/", "/README.md", "/LICENSE"]

# ADR-116: absorbed from the standalone `cfgv` crate (cfgv-rs 0.3.0). The library keeps the name `cfgv`, so its
# users write `cfgv::` (the workspace dependency key is `cfgv`, `package = "snp-cfgv"`).
[lib]
name = "cfgv"

[dependencies]
indexmap.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
## `Serialize`/`Deserialize` for `Value` and a `Deserializer` for `&Value`.
serde = ["dep:serde"]

[lints]
workspace = true
