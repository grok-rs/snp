[package]
name = "cfgv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.4"
cfgv = { path = "..", features = ["serde"] }
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bigint"
path = "fuzz_targets/bigint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "py_text"
path = "fuzz_targets/py_text.rs"
test = false
doc = false
bench = false
