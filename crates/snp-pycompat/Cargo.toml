[package]
name = "snp-pycompat"
description = "CPython stdlib semantics (str/bytes splitting, codecs, repr, shlex, os.path, pre-commit composites)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ADR-088: published to crates.io; the package carries the sources only (tests, vectors and benches stay in
# the repository).
include = ["/src/"]

# ADR-056: no dependencies besides std (not even dev-dependencies; `cargo tree -p snp-pycompat`
# must show none). `regex` is banned here (deny.toml).

[lints]
workspace = true
