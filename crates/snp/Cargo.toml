[package]
name = "snp"
description = "You Shell Not Pass: a drop-in replacement for pre-commit 4.6.2 with lefthook-inspired extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ADR-088: published to crates.io; the package carries the sources only (tests, vectors and benches stay in
# the repository).
include = ["/src/"]
default-run = "snp"

# cargo-dist releases snp, the one released package, explicitly (it skips `publish = false` packages, and snp was one
# until ADR-088 published it to crates.io).
[package.metadata.dist]
dist = true

# `cargo binstall snp` (ADR-088): the release archives of dist-workspace.toml. The `.tar.xz` archives hold a
# `snp-<target>/` directory, the Windows `.zip` archives the files at their root.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[lib]
path = "src/lib.rs"

[[bin]]
name = "snp"
path = "src/main.rs"
doc = false

[dependencies]
snp-cli.workspace = true
snp-cmd.workspace = true
snp-core.workspace = true
snp-git.workspace = true
snp-hooks.workspace = true
snp-lang.workspace = true
snp-migrate.workspace = true
snp-net.workspace = true
snp-os.workspace = true
snp-proc.workspace = true
snp-pyre.workspace = true
snp-repo.workspace = true
snp-run.workspace = true
snp-store.workspace = true
memchr.workspace = true
dhat = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# node tarballs are .tar.xz on Unix (ARCHITECTURE §1.4.9)
snp-net = { workspace = true, features = ["xz"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
# integration tests (tests/it) and the WP-36 criterion benches
criterion.workspace = true
dhat.workspace = true
# `TagSet` for the classifier filters of the tagging bench (WP-36)
file-identify.workspace = true
snp-argparse.workspace = true
snp-files.workspace = true
snp-pycompat.workspace = true
snp-pyre.workspace = true
snp-testkit.workspace = true
snp-yaml.workspace = true
tempfile.workspace = true

[features]
# Test-only instrumentation: fault injection (ADR-066), the spawn log and the language shim
# harness (never in releases).
testing = ["snp-core/fault-injection", "snp-proc/testing", "snp-git/testing", "snp-lang/testing"]
# dhat heap profiling for the B3 allocation budget (WP-36).
dhat-heap = ["dep:dhat"]
# mimalloc as the musl global allocator, iff ADR-079's measurement adopts it (WP-36).
musl-mimalloc = ["dep:mimalloc"]

# WP-36's criterion micro-benches (ARCHITECTURE §12.3); W0 stubs under benches/.
[[bench]]
name = "argparse_hook_impl"
harness = false

[[bench]]
name = "len_cjk"
harness = false

[[bench]]
name = "pyre_kinds"
harness = false

[[bench]]
name = "shuffle_partition"
harness = false

[[bench]]
name = "tagging_tiers"
harness = false

[[bench]]
name = "yaml_manifest_load"
harness = false

[lints]
workspace = true
