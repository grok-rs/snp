# D-DATA-01 (DATA, owner WP-23): the K+ recovery line on stderr after a failed stash restore (X13-STASH-02)
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands` and `expect_divergence` (ARCHITECTURE §13.2).
# The hook replaces the unstaged-modified file with a directory: both applies fail, the rollback checkout cannot
# replace the directory, and the restore fails with a CalledProcessError (exit 3) in both tools. pre-commit's stderr
# is empty; snp adds the K+ line naming the patch and `git apply --3way` (docs/divergences/D-DATA-01.md).
name: divergences/D-DATA-01-k-plus-hint
expect_divergence: D-DATA-01
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {foo: "1\n2\n3\n"}
  exec: []
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: clobber
            name: clobber
            # the fix conflicts with the stashed change (the first apply fails) and a held index lock makes the
            # rollback checkout fail too: the final restore fails in both tools
            entry: sh -c 'echo clobbered > foo && touch .git/index.lock' --
            language: system
            files: ^foo$
  commit: [".pre-commit-config.yaml"]
  stage: [foo]
  unstaged: {foo: "1\nTWO\n3\n"}
  git_config: {}
steps:
  - tool: [run]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: tierB
  stderr: exact
  exit: exact
  tree: false
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 3
    stderr: ""
  snp:
    exit: 3
    stderr_matches: '^\[ERROR\] Your unstaged changes are saved in (\S+); restore them with: git apply --3way \1\n$'
