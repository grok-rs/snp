# D-CRASH-10 (CRASH, owner WP-18): any all-zero OID (40 or 64 hex) is null
# A branch deletion pushed from a SHA-256 repository: pre-commit 4.6.2 compares the local sha with Z40 only, runs
# the hooks on `<remote>..<64 zeros>` and crashes (exit 3); snp skips the deletion (exit 0, no output).
# Extensions of the 10 §7.4.3 schema used here: `object_format` on `work` and on a `repos` entry, `bare: true` for an
# empty remote, and the `${head}` / `${z64}` substitutions (the work repo's HEAD sha, 64 zeros).
expect_divergence: D-CRASH-10
name: divergences/D-CRASH-10-sha256-branch-deletion
since: "4.6.2"
requires: {git: ">=2.29", net: false, tools: [], os: [linux, macos, windows], pty: false}
repos:
  remote: {bare: true, object_format: sha256}
work:
  object_format: sha256
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: echo
            name: echo
            entry: echo
            language: system
            stages: [pre-push]
  commit: [".pre-commit-config.yaml"]
steps:
  - git: [remote, add, origin, "${repo:remote}"]
  - git: [push, -q, origin, "master:gone"]
  - tool: [hook-impl, --hook-type=pre-push, --hook-dir, .git/hooks, --, origin, "${repo:remote}"]
    stdin: "(delete) ${z64} refs/heads/gone ${head}\n"
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
expected:
  oracle:
    exit: 3
    stdout_starts_with: "An unexpected error has occurred: CalledProcessError: command: ("
  snp:
    exit: 0
    stdout: ""
    stderr: ""
