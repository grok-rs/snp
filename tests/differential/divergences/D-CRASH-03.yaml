# D-CRASH-03 (CRASH, owner WP-21): the one-of / type-tag validation errors, exit 1
# Scenario in the schema of docs/research/10-test-strategy.md §7.4.3; `expected` states how each side
# must differ (WP-35's harness fails when the difference stops reproducing).
expect_divergence: D-CRASH-03
name: divergences/D-CRASH-03-unhashable-stage
since: "4.6.2"
requires: {git: ">=2.19", net: false, tools: [], os: [linux, macos, windows], pty: false}
work:
  files: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: a
            name: a
            entry: a
            language: system
            stages: [[a]]
  commit: [".pre-commit-config.yaml"]
steps:
  - tool: [validate-config, .pre-commit-config.yaml]
compare:
  stdout: exact
  stderr: exact
  exit: exact
expected:
  oracle:
    exit: 3
    stdout_starts_with: "An unexpected error has occurred: TypeError: unhashable type: 'list'\n"
  snp:
    exit: 1
    stdout_contains: "==> At key: stages\n==> At index 0\n=====> Expected one of commit-msg, manual,"
