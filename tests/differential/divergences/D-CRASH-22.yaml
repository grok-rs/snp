# D-CRASH-22 (CRASH, owner WP-26): `hazmat` with no tool is an argparse usage error, exit 2.
# pre-commit 4.7.0 parses `hazmat` to Namespace(tool=None) and crashes in `impl` (AttributeError, exit 3, crash log);
# snp reports the missing tool with the command's usage (docs/divergences/D-CRASH-22.md).
name: divergences/D-CRASH-22
since: "4.5.0"
expect_divergence: D-CRASH-22
status: active
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos, windows], pty: false}
repos: {}
work:
  files: {}
  exec: []
  symlinks: {}
  config: |
    repos: []
  commit: [".pre-commit-config.yaml"]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  # pre-commit: stdout `An unexpected error has occurred: AttributeError: …`, exit 3.
  # snp: stderr usage + `pre-commit hazmat: error: the following arguments are required: tool`, exit 2.
  - tool: [hazmat]
    env: {COLUMNS: "80"}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
