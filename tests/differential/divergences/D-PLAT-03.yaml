# D-PLAT-03 (PLAT/SEC, owner WP-15): Windows batch hooks receive file names literally (BatBadBut-safe quoting).
# pre-commit lets cmd.exe interpret `&` in an unquoted file name (the second command runs); snp passes the name
# quoted (docs/divergences/D-PLAT-03.md). The name has no space: CPython's `list2cmdline` quotes an argument with a
# space or tab, and inside quotes cmd.exe does not split on `&` (`echo.` echoes the rest of its word).
name: divergences/D-PLAT-03
since: "4.1.0"
expect_divergence: D-PLAT-03
requires:
  git: ">=2.31"
  net: false
  tools: []
  os: [windows]
  pty: false
work:
  files:
    run.cmd: "@echo off\r\necho %*\r\n"
    "a&echo.INJECTED.txt": "x\n"
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: batch-echo
            name: batch echo
            entry: run.cmd
            language: system
            files: \.txt$
            verbose: true
  commit: [".pre-commit-config.yaml", run.cmd, "a&echo.INJECTED.txt"]
steps:
  - tool: [run, --all-files]
    env:
      # run.cmd is found through PATH (the work tree root first).
      PATH: "${work};${PATH}"
compare:
  # Diverges by design in the hook output (pre-commit executes the injected `echo`).
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
