# D-CRASH-09 (CRASH, owner WP-22): a FIFO passed via --files is classified without blocking.
# Extension of the 10 §7.4.3 schema: `fifos` (posix) lists worktree FIFOs the materialiser creates with mkfifo
# (git cannot track them); `timeout` bounds the step (pre-commit 4.6.2 hangs forever in identify's open()).
expect_divergence: D-CRASH-09
name: divergences/D-CRASH-09-fifo-via-files
since: "4.6.2"
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {}
  fifos: [ff]
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: echo
            name: echo
            entry: echo
            language: system
  commit: [".pre-commit-config.yaml"]
  stage: []
steps:
  - tool: [run, --files, ff]
    timeout: 5
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
expected:
  oracle:
    timed_out: true
    stdout: ""
  snp:
    exit: 0
    stdout: |
      echo.....................................................................Passed
