# D-PLAT-10 (PLAT, owner WP-15): Windows CPU count from available_parallelism (current processor group).
# Diverges only on hosts with more than 64 logical CPUs: the number of xargs invocations (and so the `count` lines)
# differs; every file is still checked (docs/divergences/D-PLAT-10.md). Skipped elsewhere.
name: divergences/D-PLAT-10
since: "4.1.0"
expect_divergence: D-PLAT-10
requires:
  git: ">=2.31"
  net: false
  tools: [snp-probe]
  os: [windows]
  pty: false
  # Only a machine with several processor groups shows the difference.
  logical_cpus_min: 65
work:
  generated: {pattern: "f{i:04}.txt", count: 2000, content: "x\n"}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: count
            name: count
            entry: ${probe} count
            language: system
            files: \.txt$
            verbose: true
  commit: [".pre-commit-config.yaml", "*.txt"]
steps:
  - tool: [run, --all-files]
compare:
  stdout: exact
  stderr: exact
  exit: exact
