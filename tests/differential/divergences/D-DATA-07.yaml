# D-DATA-07 (DATA, owner WP-32): a CDPATH-doubled --hook-dir is repaired, so the legacy hook runs
name: divergences/D-DATA-07-cdpath-hook-dir
expect_divergence: D-DATA-07
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {".git/hooks/pre-commit.legacy": "#!/bin/sh\necho legacy-ran\n"}
  exec: [".git/hooks/pre-commit.legacy"]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: p
            name: passing
            entry: 'true'
            language: system
            always_run: true
  commit: [".pre-commit-config.yaml"]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - tool: [hook-impl, --config=.pre-commit-config.yaml, --hook-type=pre-commit, --hook-dir, "${work}/.git/hooks\n${work}/.git/hooks", --]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 0
    stdout_not_contains: "legacy-ran"
  snp:
    exit: 0
    stdout_contains: "legacy-ran\npassing....."
