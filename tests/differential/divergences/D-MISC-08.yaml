# D-MISC-08 (TIERB, owner WP-33): the crash-log body below the version block is snp's (Tier B)
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands`, `expect_divergence` and `expected` (ARCHITECTURE §13.2).
# `install` with .git/hooks/pre-commit being a directory crashes both tools identically on stdout (exit 3,
# IsADirectoryError, `Check the log at …`); the log bodies differ: a Python traceback in pre-commit 4.6.2, the
# error chain (here `(no further details)`) in snp. `crash_log_*` read the file named by `Check the log at`.
name: divergences/D-MISC-08-crash-log-body
expect_divergence: D-MISC-08
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {}
  exec: []
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: t
            name: t
            entry: "true"
            language: system
  commit: [".pre-commit-config.yaml"]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - shell: "mkdir -p .git/hooks/pre-commit"
  - tool: [install]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: tierB
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    steps:
      2:
        exit: 3
        stdout_starts_with: "An unexpected error has occurred: IsADirectoryError: [Errno 21] Is a directory: '.git/hooks/pre-commit'\nCheck the log at "
        crash_log_contains: "Traceback (most recent call last):"
  snp:
    steps:
      2:
        exit: 3
        stdout_starts_with: "An unexpected error has occurred: IsADirectoryError: [Errno 21] Is a directory: '.git/hooks/pre-commit'\nCheck the log at "
        crash_log_contains: "### error information\n\n```\nAn unexpected error has occurred: IsADirectoryError: [Errno 21] Is a directory: '.git/hooks/pre-commit'\n```\n\n```\n(no further details)\n```\n"
        crash_log_not_contains: "Traceback"
