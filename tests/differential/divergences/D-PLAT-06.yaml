# D-PLAT-06 (PLAT, owner WP-32): a --files path on another drive stays absolute instead of crashing relpath
name: divergences/D-PLAT-06-cross-drive-files
expect_divergence: D-PLAT-06
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [windows], pty: false, second_drive: true}
repos: {}
work:
  files: {a.txt: "a\n"}
  exec: []
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: p
            name: passing
            entry: cmd /c exit 0
            language: system
  commit: [".pre-commit-config.yaml", a.txt]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - tool: [run, --files, "${second_drive}\\x.txt"]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 3
    stdout_contains: "ValueError: path is on mount"
  snp:
    exit: 0
