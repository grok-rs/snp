# D-CRASH-13 (CRASH, owner WP-16): non-UTF-8 output of a tool probe is decoded lossily instead of crashing.
# Scenario schema: docs/research/10-test-strategy.md §7.4.3. `${work}` is the materialised worktree root and
# `${PATH}` the hermetic PATH of §7.3.2 (both substituted by WP-35's materialiser).
expect_divergence: D-CRASH-13
name: divergences/D-CRASH-13-lua-version-probe-not-utf8
since: "4.6.2"
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files:
    # A fake luarocks: `luarocks config --lua-ver` prints `5.4\xff` (not UTF-8); every other call succeeds silently.
    tools/luarocks: |
      #!/bin/sh
      if [ "$1" = config ] && [ "$2" = --lua-ver ]; then printf '5.4\377\n'; fi
      exit 0
    tools/lua-hook: |
      #!/bin/sh
      echo "lua hook ran"
  exec: [tools/luarocks, tools/lua-hook]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: lua-hook
            name: lua hook
            entry: lua-hook
            language: lua
            pass_filenames: false
  commit: [".pre-commit-config.yaml", tools/luarocks, tools/lua-hook]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - tool: [run, --all-files]
    env:
      PATH: "${work}/tools:${PATH}"
    stdin: ""
    tty: false
# pre-commit 4.7.0: the four install lines, then
#   `An unexpected error has occurred: UnicodeDecodeError: 'utf-8' codec can't decode byte 0xff in position 3:
#   invalid start byte`, `Check the log at …`, exit 3.
# snp: the four install lines, then `lua hook….Passed`, exit 0.
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
