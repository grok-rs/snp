# D-DATA-14 (DATA, owner WP-21): rewrites deduplicated by YAML node
# Scenario in the schema of docs/research/10-test-strategy.md §7.4.3; `expected` states how each side
# must differ (WP-35's harness fails when the difference stops reproducing).
expect_divergence: D-DATA-14
name: divergences/D-DATA-14-migrate-alias-once
since: "4.6.2"
requires: {git: ">=2.19", net: false, tools: [], os: [linux, macos, windows], pty: false}
work:
  files: {}
  config: |
    default_stages: &s [commit]
    repos:
    -   repo: local
        hooks:
        -   id: x
            name: x
            entry: x
            language: system
            stages: *s
  commit: [".pre-commit-config.yaml"]
steps:
  - tool: [migrate-config]
  - tool: [validate-config, .pre-commit-config.yaml]
compare:
  stdout: exact
  stderr: exact
  exit: exact
  config_file: exact
expected:
  oracle:
    config_file_contains: "default_stages: &s [pre-commitpre-commit]\n"
    exit_of_step_2: 1
  snp:
    config_file_contains: "default_stages: &s [pre-commit]\n"
    exit_of_step_2: 0
