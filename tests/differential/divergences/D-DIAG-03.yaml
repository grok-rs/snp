# D-DIAG-03 (DIAG, owner WP-32): `run` on a terminal hints that git still runs pre-commit's hook script
name: divergences/D-DIAG-03-run-hint
expect_divergence: D-DIAG-03
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: true}
repos: {}
work:
  files:
    a.txt: "a\n"
    pc-hook: |
      #!/usr/bin/env bash
      # File generated by pre-commit: https://pre-commit.com
      # ID: 138fd403232d2ddd5efb44317e38bf03

      # start templated
      INSTALL_PYTHON=/nonexistent/python
      ARGS=(hook-impl --config=.pre-commit-config.yaml --hook-type=pre-commit)
      # end templated
  exec: [pc-hook]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: p
            name: passing
            entry: 'true'
            language: system
            always_run: true
  commit: [".pre-commit-config.yaml", a.txt]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  # Python pre-commit's hook script (its template), installed by hand on both sides
  - shell: "mkdir -p .git/hooks && cp pc-hook .git/hooks/pre-commit"
  - tool: [run]
    env: {SNP_NO_HINTS: ""}
    stdin: ""
    tty: true
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 0
    stderr: ""
  snp:
    exit: 0
    stdout_matches: '^hint: \.git/hooks/pre-commit runs Python pre-commit, not snp; run `(snp|pre-commit) install` to switch\n'
