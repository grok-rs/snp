# D-CRASH-05 (CRASH, owner WP-32): an empty entry fails its hook instead of crashing the run
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands` and `expect_divergence` (ARCHITECTURE §13.2).
name: divergences/D-CRASH-05-empty-entry
expect_divergence: D-CRASH-05
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos, windows], pty: false}
repos: {}
work:
  files: {a.txt: "a\n"}
  exec: []
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: empty
            name: empty entry
            entry: ''
            language: system
        -   id: after
            name: after
            entry: 'true'
            language: system
  commit: [".pre-commit-config.yaml", a.txt]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - tool: [run, --all-files]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 3
    stdout_contains: "An unexpected error has occurred: IndexError: tuple index out of range"
  snp:
    exit: 1
    stdout_contains: "- exit code: 1\n\nExecutable `` not found\n\nafter."
