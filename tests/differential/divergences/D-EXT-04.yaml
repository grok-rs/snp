# D-EXT-04 (DATA, owner WP-23): `_SNP_STASH_LOCK=<token>` exported to hooks while a stash is held
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands` and `expect_divergence` (ARCHITECTURE §13.2).
# A verbose hook prints the variable: empty under pre-commit (the grep fails, exit 1), a 32-hex-digit token under snp.
name: divergences/D-EXT-04-stash-lock-token
expect_divergence: D-EXT-04
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {foo: "1\n"}
  exec: []
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: token
            name: token
            entry: sh -c 'printenv _SNP_STASH_LOCK' --
            language: system
            verbose: true
            files: ^foo$
  commit: [".pre-commit-config.yaml"]
  stage: [foo]
  unstaged: {}
  git_config: {}
steps:
  - tool: [run]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: tierB
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 1
  snp:
    exit: 0
    stdout_matches: '(?m)^[0-9a-f]{32}$'
