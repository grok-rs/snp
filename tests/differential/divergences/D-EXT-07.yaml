# D-EXT-07 (EXT, owner WP-12): snp-brand commands and flags (§8), including their presence in the snp brand's usage/help blocks
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands` and `expect_divergence` (ARCHITECTURE §13.2).
# In the snp brand the extension commands and flags appear in the usage/help blocks and are accepted, where the
# (prog-patched) pre-commit 4.7.0 oracle lists none of them and rejects them with exit 2. Exact snp bytes:
# crates/snp-cli/tests/goldens/snp.json; rationale: docs/divergences/D-EXT-07.md.
name: divergences/D-EXT-07
expect_divergence: D-EXT-07
status: active
since: "4.6.2"
brands: [snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos, windows], pty: false}
repos: {}
work:
  files: {a.txt: "a\n"}
  exec: []
  symlinks: {}
  config: |
    repos: []
  commit: [".pre-commit-config.yaml", a.txt]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  # The command list names cache, completions, config, doctor, list, migrate and self.
  - tool: [-h]
    env: {COLUMNS: "80"}
    stdin: ""
    tty: false
  # --stdin-files in the file-selection group, -j/--jobs … --no-local-config, `[hook ...]`.
  - tool: [run, -h]
    env: {COLUMNS: "80"}
    stdin: ""
    tty: false
  # Several hook ids are accepted (pre-commit: `unrecognized arguments: b`, exit 2).
  - tool: [run, a, b]
    env: {COLUMNS: "80"}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
