# D-PLAT-09 (PLAT, owner WP-15): Windows batch partitions are re-split when the quoted command line exceeds 8191.
# pre-commit: "The command line is too long." (Failed, exit 1); snp: Passed (docs/divergences/D-PLAT-09.md).
name: divergences/D-PLAT-09
since: "4.1.0"
expect_divergence: D-PLAT-09
requires:
  git: ">=2.31"
  net: false
  tools: []
  os: [windows]
  pty: false
work:
  files:
    check.cmd: "@exit /b 0\r\n"
    # 1000 files `a b0000` … `a b0999` (generated by the harness): quoting adds 2 characters per name.
    generated: {pattern: "a b{i:04}", count: 1000, content: "x\n"}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: batch-check
            name: batch check
            entry: check.cmd
            language: system
            files: ^a b
            require_serial: true
  commit: [".pre-commit-config.yaml", check.cmd, "a b*"]
steps:
  - tool: [run, --all-files]
    env:
      PATH: "${work};${PATH}"
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
