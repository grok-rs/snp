# D-CRASH-11 (CRASH, owner WP-18): same algorithm on bytes (ASCII whitespace), hooks run
# A push whose ref name is not UTF-8: pre-commit 4.6.2 decodes the stdin strictly and crashes (exit 3); snp parses the
# bytes and runs the pre-push hooks (a root push: --all-files).
# Extensions of the 10 §7.4.3 schema used here: `bare: true` for an empty remote, the `${head}` substitution (the work
# repo's HEAD sha) and `stdin_bytes`, a text whose `\xNN` escapes stand for raw bytes, expanded by the harness after
# the substitutions (`!!binary` cannot carry a substitution).
expect_divergence: D-CRASH-11
name: divergences/D-CRASH-11-non-utf8-pre-push-stdin
since: "4.6.2"
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos:
  remote: {bare: true}
work:
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: echo
            name: echo
            entry: echo
            language: system
            stages: [pre-push]
  commit: [".pre-commit-config.yaml"]
steps:
  - git: [remote, add, origin, "${repo:remote}"]
  - tool: [hook-impl, --hook-type=pre-push, --hook-dir, .git/hooks, --, origin, "${repo:remote}"]
    stdin_bytes: 'refs/heads/caf\xe9 ${head} refs/heads/caf\xe9 0000000000000000000000000000000000000000\n'
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
expected:
  oracle:
    exit: 3
    stdout_starts_with: "An unexpected error has occurred: UnicodeDecodeError: 'utf-8' codec can't decode byte 0xe9 in position 14: invalid continuation byte\n"
  snp:
    exit: 0
    stdout_contains: "echo"
