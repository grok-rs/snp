# D-SEC-09 (SEC, owner WP-15): shebang lines are read at most 64 KiB deep (file-identify's MAX_SHEBANG_BYTES).
# pre-commit parses the whole 70 KB line and runs `/bin/echo <70000 a> ./long.sh`; snp treats it as "no shebang" and
# the kernel runs the script with the line truncated to 256 bytes (docs/divergences/D-SEC-09.md).
name: divergences/D-SEC-09
since: "4.1.0"
expect_divergence: D-SEC-09
requires:
  git: ">=2.31"
  net: false
  tools: []
  os: [linux]
  pty: false
work:
  files:
    # 12 + 70000 + 1 bytes: `#!/bin/echo ` followed by 70 000 `a` and a newline (generated by the harness).
    long.sh: {generate: {prefix: "#!/bin/echo ", repeat: "a", count: 70000, suffix: "\n"}}
  exec: [long.sh]
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: long-shebang
            name: long shebang
            entry: ./long.sh
            language: system
            pass_filenames: false
            always_run: true
            verbose: true
  commit: [".pre-commit-config.yaml", long.sh]
steps:
  - tool: [run, --all-files]
compare:
  # Diverges by design in the verbose hook output (70 011 vs 254 bytes); exit codes agree (0).
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
