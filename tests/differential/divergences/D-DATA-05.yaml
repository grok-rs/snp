# D-DATA-05 (DATA, owner WP-33): atomic LF sh template that replaces a symlink instead of writing through it
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands`, `expect_divergence` and `expected` (ARCHITECTURE §13.2).
# .git/hooks/pre-commit is a symlink to the tracked tools/hook (a pre-commit 4.6.2 script with another
# INSTALL_PYTHON). pre-commit rewrites tools/hook through the link (worktree diff); snp replaces the link with a
# regular file and tools/hook stays as committed (`compare.tree` diverges).
name: divergences/D-DATA-05-install-over-a-symlink
expect_divergence: D-DATA-05
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files:
    tools/hook: |
        #!/usr/bin/env bash
        # File generated by pre-commit: https://pre-commit.com
        # ID: 138fd403232d2ddd5efb44317e38bf03

        # start templated
        INSTALL_PYTHON=/old/python
        ARGS=(hook-impl --config=.pre-commit-config.yaml --hook-type=pre-commit)
        # end templated

        HERE="$(cd "$(dirname "$0")" && pwd)"
        ARGS+=(--hook-dir "$HERE" -- "$@")

        if [ -x "$INSTALL_PYTHON" ]; then
            exec "$INSTALL_PYTHON" -mpre_commit "$${ARGS[@]}"
        elif command -v pre-commit > /dev/null; then
            exec pre-commit "$${ARGS[@]}"
        else
            echo '`pre-commit` not found.  Did you forget to activate your virtualenv?' 1>&2
            exit 1
        fi
  exec: [tools/hook]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: t
            name: t
            entry: "true"
            language: system
  commit: [".pre-commit-config.yaml", tools/hook]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - shell: "mkdir -p .git/hooks && ln -s ../../tools/hook .git/hooks/pre-commit"
  - tool: [install]
    env: {}
    stdin: ""
    tty: false
  - shell: "git status --porcelain -- tools && test -L .git/hooks/pre-commit && echo symlink || echo regular"
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    steps:
      3: {stdout: " M tools/hook\nsymlink\n"}
  snp:
    steps:
      3: {stdout: "regular\n"}
