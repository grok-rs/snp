# D-DIAG-02 (DIAG, owner WP-33): M1/M1b/M2/M3/M12 notes on stderr when replacing other managers' scripts
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands`, `expect_divergence` and `expected` (ARCHITECTURE §13.2).
# pre-commit holds a pre-commit 4.6.2 script (INSTALL_PYTHON=/old/python), pre-push a prek script. stdout and
# exit are pre-commit's (`pre-commit installed at …`); stderr carries snp's M1 and M3 notes only.
name: divergences/D-DIAG-02-migration-notes
expect_divergence: D-DIAG-02
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files:
    old-pre-commit: |
        #!/usr/bin/env bash
        # File generated by pre-commit: https://pre-commit.com
        # ID: 138fd403232d2ddd5efb44317e38bf03

        # start templated
        INSTALL_PYTHON=/old/python
        ARGS=(hook-impl --config=.pre-commit-config.yaml --hook-type=pre-commit)
        # end templated

        HERE="$(cd "$(dirname "$0")" && pwd)"
        ARGS+=(--hook-dir "$HERE" -- "$@")

        if [ -x "$INSTALL_PYTHON" ]; then
            exec "$INSTALL_PYTHON" -mpre_commit "${ARGS[@]}"
        elif command -v pre-commit > /dev/null; then
            exec pre-commit "${ARGS[@]}"
        else
            echo '`pre-commit` not found.  Did you forget to activate your virtualenv?' 1>&2
            exit 1
        fi
    prek-pre-push: |
        #!/bin/sh
        # File generated by prek: https://github.com/j178/prek
        # ID: 182c10f181da4464a3eec51b83331688
        HERE="$(cd "$(dirname "$0")" && pwd)"
        PREK=/usr/local/bin/prek

        # Check if the full path to prek is executable, otherwise fallback to PATH
        if [ ! -x "$PREK" ]; then
            PREK="prek"
        fi

        exec "$PREK" hook-impl --hook-dir "$HERE" --script-version 4 --hook-type=pre-push -- "$@"
  exec: [old-pre-commit, prek-pre-push]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: t
            name: t
            entry: "true"
            language: system
  commit: [".pre-commit-config.yaml", old-pre-commit, prek-pre-push]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - shell: "mkdir -p .git/hooks && cp old-pre-commit .git/hooks/pre-commit && cp prek-pre-push .git/hooks/pre-push"
  - tool: [install]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: behavior
  config_file: exact
  store: ignore
expected:
  oracle:
    steps:
      2: {exit: 0, stderr: ""}
  snp:
    steps:
      2:
        exit: 0
        stderr_matches: '^Replaced hook script from pre-commit at \.git/hooks/pre-commit \(Python: /old/python\)\nNote: \.git/hooks/pre-push still runs prek; run `(pre-commit|snp) install -t pre-push` to switch it to snp\n$'
