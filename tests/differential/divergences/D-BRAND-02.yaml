# D-BRAND-02 (BRAND, owner WP-33): prek and snp 1.x hook scripts are manager scripts, replaced in place
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands`, `expect_divergence` and `expected` (ARCHITECTURE §13.2).
# .git/hooks/pre-commit is prek's script: pre-commit 4.7.0 moves it to pre-commit.legacy and prints the
# migration-mode lines; snp replaces it in place (no .legacy, M1 on stderr).
name: divergences/D-BRAND-02-prek-script-replaced
expect_divergence: D-BRAND-02
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files:
    prek-hook: |
        #!/bin/sh
        # File generated by prek: https://github.com/j178/prek
        # ID: 182c10f181da4464a3eec51b83331688
        HERE="$(cd "$(dirname "$0")" && pwd)"
        PREK=/usr/local/bin/prek

        # Check if the full path to prek is executable, otherwise fallback to PATH
        if [ ! -x "$PREK" ]; then
            PREK="prek"
        fi

        exec "$PREK" hook-impl --hook-dir "$HERE" --script-version 4 --hook-type=pre-commit -- "$@"
  exec: [prek-hook]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: t
            name: t
            entry: "true"
            language: system
  commit: [".pre-commit-config.yaml", prek-hook]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - shell: "mkdir -p .git/hooks && cp prek-hook .git/hooks/pre-commit"
  - tool: [install]
    env: {}
    stdin: ""
    tty: false
  - shell: "test -e .git/hooks/pre-commit.legacy && echo legacy || echo none"
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: behavior
  config_file: exact
  store: ignore
expected:
  oracle:
    steps:
      2:
        exit: 0
        stdout: "Running in migration mode with existing hooks at .git/hooks/pre-commit.legacy\nUse -f to use only pre-commit.\npre-commit installed at .git/hooks/pre-commit\n"
      3: {stdout: "legacy\n"}
  snp:
    steps:
      2:
        exit: 0
        stdout_matches: '^(pre-commit|snp) installed at \.git/hooks/pre-commit\n$'
        stderr: "Replaced hook script from prek at .git/hooks/pre-commit\n"
      3: {stdout: "none\n"}
