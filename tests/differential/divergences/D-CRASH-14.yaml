# D-CRASH-14 (CRASH, owner WP-32): a broken legacy hook is a failed legacy hook (rc 1), snp's hooks still run
name: divergences/D-CRASH-14-broken-legacy-hook
expect_divergence: D-CRASH-14
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {".git/hooks/pre-commit.legacy": "#!/nonexistent/interp\n"}
  exec: [".git/hooks/pre-commit.legacy"]
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: p
            name: passing
            entry: 'true'
            language: system
            always_run: true
  commit: [".pre-commit-config.yaml"]
  stage: []
  unstaged: {}
  git_config: {}
steps:
  - tool: [hook-impl, --config=.pre-commit-config.yaml, --hook-type=pre-commit, --hook-dir, "${work}/.git/hooks", --]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    exit: 3
    stdout_contains: "ExecutableNotFoundError: Executable `/nonexistent/interp` not found"
  snp:
    exit: 1
    stderr: "Executable `/nonexistent/interp` not found\n"
    stdout_contains: "passing....."
