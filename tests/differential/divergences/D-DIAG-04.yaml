# D-DIAG-04 (DIAG, owner WP-23): stash notices on stderr — here the recovery notice for an orphaned journal
# Scenario schema: docs/research/10-test-strategy.md §7.4.3 plus `brands`, `expect_divergence` and the `signal` step
# key of ARCHITECTURE §13.2. Step 1 is killed (SIGKILL) during its hook; step 2 runs a clean commit: stdout and exit
# are pre-commit's, stderr carries snp's notice only.
name: divergences/D-DIAG-04-stash-notices
expect_divergence: D-DIAG-04
status: active
since: "4.6.2"
brands: [compat, snp]
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {foo: "1\n2\n3\n"}
  exec: []
  symlinks: {}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: slow
            name: slow
            entry: sh -c 'test -e .second-run || { touch .hook-started; exec sleep 30; }' --
            language: system
            files: ^foo$
  commit: [".pre-commit-config.yaml"]
  stage: [foo]
  unstaged: {foo: "1\nTWO\n3\n"}
  git_config: {}
steps:
  - tool: [run]
    env: {}
    stdin: ""
    tty: false
    signal: {name: KILL, after: .hook-started}
  - shell: "touch .second-run && git checkout -- foo"
  - tool: [run]
    env: {}
    stdin: ""
    tty: false
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
  hooks_dir: ignore
  config_file: exact
  store: ignore
expected:
  oracle:
    steps:
      3: {exit: 0, stderr: ""}
  snp:
    steps:
      3:
        exit: 0
        stderr_matches: '^snp: an earlier run was interrupted before it restored your unstaged changes; they are saved in \S+ \(index tree [0-9a-f]{40}\)\. Restore with: git apply --whitespace=nowarn \S+; if git apply reports that the patch does not apply, those files changed after the stash \(hook fixes or later edits\): keep a copy with git diff --binary [0-9a-f]{40} > \S+\.now, put them back with git --literal-pathspecs restore --source=[0-9a-f]{40} --worktree -- foo, then run the command again\nsnp: this notice repeats until those changes are back in the worktree; to dismiss it and keep the patch, run: snp doctor --fix --stash\n$'
