# D-CRASH-08 (CRASH, owner WP-22): a file deleted by an earlier hook is excluded from this and later hooks.
# Scenario schema: docs/research/10-test-strategy.md §7.4.3. Hook 1 deletes b.txt before any hook needed its tags;
# pre-commit 4.7.0 then crashes identifying it for hook 2 (ValueError, exit 3); snp drops it and runs hook 2.
expect_divergence: D-CRASH-08
name: divergences/D-CRASH-08-file-deleted-by-an-earlier-hook
since: "4.6.2"
requires: {git: ">=2.31", net: false, tools: [], os: [linux, macos], pty: false}
repos: {}
work:
  files: {a.txt: "a\n", b.txt: "b\n"}
  config: |
    repos:
    -   repo: local
        hooks:
        -   id: rm-b
            name: rm b
            entry: rm -f b.txt
            language: system
            files: ^a\.txt$
            pass_filenames: false
            always_run: true
        -   id: echo
            name: echo
            entry: echo
            language: system
  commit: [".pre-commit-config.yaml", a.txt, b.txt]
  stage: []
steps:
  - tool: [run, --all-files]
compare:
  stdout: exact
  stderr: exact
  exit: exact
  tree: true
  index: true
  refs: true
expected:
  oracle:
    exit: 3
    stdout: |
      rm b.....................................................................Failed
      - hook id: rm-b
      - files were modified by this hook
      An unexpected error has occurred: ValueError: b.txt does not exist.
      Check the log at ${store}/pre-commit.log
  snp:
    exit: 1
    stdout: |
      rm b.....................................................................Failed
      - hook id: rm-b
      - files were modified by this hook
      echo.....................................................................Passed
