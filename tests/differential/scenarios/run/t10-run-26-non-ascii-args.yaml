name: run/t10-run-26-non-ascii-args
covers: [T10-RUN-26]
work:
  files: {a.txt: ""}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: "☃", name: snowman ☃, entry: echo, args: ["☃", "啊あ아"], language: system, verbose: true}
  commit: [.pre-commit-config.yaml]
  stage: [a.txt]
steps:
  - tool: [run, "☃"]
  - tool: [install]
  - git: [commit, -m, "☃ commit"]
