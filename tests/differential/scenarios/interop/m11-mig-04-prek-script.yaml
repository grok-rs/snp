name: interop/m11-mig-04-prek-script
description: '11 §A.20 MIG-04 — a prek hook script (prek install.rs template), then install'
covers: [M11-MIG-04]
tags: [migration]
expect_divergence: D-BRAND-02
work:
  files: {a.txt: ""}
  config: "repos: []\n"
  commit: [.pre-commit-config.yaml]
  setup:
    - write:
        .git/hooks/pre-commit: |
          #!/bin/sh
          # File generated by prek: https://github.com/j178/prek
          # ID: 182c10f181da4464a3eec51b83331688

          HERE="$(cd "$(dirname "$0")" && pwd)"
          PREK=/nonexistent/prek

          # Check if the full path to prek is executable, otherwise fallback to PATH
          if [ ! -x "$PREK" ]; then
              PREK="prek"
          fi

          exec "$PREK" hook-impl --hook-dir "$HERE" --script-version 4 --hook-type=pre-commit -- "$@"
    - shell: chmod +x .git/hooks/pre-commit
steps:
  - tool: [install]
  - shell: ls .git/hooks | grep -v sample
compare:
  hooks_dir: true
