name: interop/m11-mig-07-snp1-script
description: '11 §A.20 MIG-07 — an snp 1.x hook script (V1 template header), then install'
covers: [M11-MIG-07]
tags: [migration]
expect_divergence: D-BRAND-02
work:
  files: {a.txt: ""}
  config: "repos: []\n"
  commit: [.pre-commit-config.yaml]
  setup:
    - write:
        .git/hooks/pre-commit: |
          #!/bin/sh
          # Generated by SNP (Shell Not Pass)
          exec snp --config=".pre-commit-config.yaml" run --hook-stage=pre-commit "$@"
    - shell: chmod +x .git/hooks/pre-commit
steps:
  - tool: [install]
  - shell: ls .git/hooks | grep -v sample
compare:
  hooks_dir: true
