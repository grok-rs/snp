name: interop/m11-mig-05-06-chains
description: '11 §A.20 MIG-05/06 — chain C1 (pre-commit over prek, prek in .legacy), then install'
covers: [M11-MIG-05, M11-MIG-06]
tags: [migration]
expect_divergence: D-BRAND-02
work:
  files: {a.txt: ""}
  config: "repos: []\n"
  commit: [.pre-commit-config.yaml]
  setup:
    - write:
        .git/hooks/pre-commit: |
          #!/bin/sh
          # File generated by prek: https://github.com/j178/prek
          # ID: 182c10f181da4464a3eec51b83331688
          exec prek hook-impl --hook-dir "$(dirname "$0")" --script-version 4 --hook-type=pre-commit -- "$@"
    - shell: chmod +x .git/hooks/pre-commit
steps:
  - shell: ${oracle} install
  - shell: ls .git/hooks | grep -v sample
  - tool: [install]
  - shell: ls .git/hooks | grep -v sample
compare:
  hooks_dir: true
