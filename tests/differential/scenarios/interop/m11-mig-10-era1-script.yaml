name: interop/m11-mig-10-era1-script
description: '11 §A.20 MIG-10 — an era-1-shaped Python hook script (HOOK_TYPE / CONFIG) running `pre-commit run --hook-stage commit` through the alias'
covers: [M11-MIG-10]
tags: [migration]
brands: [compat]
requires: {os: [linux, macos], tools: [python3]}
work:
  files: {a.txt: ""}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: ok, name: ok, entry: 'true', language: system}
  commit: [.pre-commit-config.yaml]
  stage: [a.txt]
  setup:
    - write:
        .git/hooks/pre-commit: |
          #!/usr/bin/env python3
          # File generated by pre-commit: https://pre-commit.com
          # ID: 138fd403232d2ddd5efb44317e38bf03
          import os
          import sys

          # start templated
          CONFIG = '.pre-commit-config.yaml'
          HOOK_TYPE = 'pre-commit'
          INSTALL_PYTHON = '/nonexistent/python'
          SKIP_ON_MISSING_CONFIG = False
          # end templated

          os.execvp('pre-commit', ['pre-commit', 'run', '--config', CONFIG, '--hook-stage', 'commit'] + sys.argv[1:])
    - shell: chmod +x .git/hooks/pre-commit
steps:
  - git: [commit, -q, -m, mig10]
