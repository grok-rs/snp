name: seed/migrate-config
covers: [T10-MIG-01]
tags: [seed]
work:
  config: |
    -   repo: local
        hooks:
        -   id: x
            name: x
            entry: 'true'
            language: system
            stages: [commit, push]
steps:
  - tool: [migrate-config]
  - tool: [migrate-config]
compare:
  # pre-commit rewrites the config through a text-mode file (CRLF on Windows); snp keeps each line's ending
  # (D-DATA-09, pinned by its divergence file)
  eol: windows
