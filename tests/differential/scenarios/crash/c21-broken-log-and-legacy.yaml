name: crash/c21-broken-log-and-legacy
description: '13 X.10 c21 — pre-commit.log is a directory; the legacy hook''s interpreter is missing / it is a directory (X13-EH-02, X13-HI-07)'
covers: [X13-EH-02, X13-HI-07]
tags: [crash-recipe]
expect_divergence: D-CRASH-14
work:
  files: {a.txt: ""}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: h, name: h, entry: 'true', language: system}
  commit: [.pre-commit-config.yaml, a.txt]
steps:
  - shell: mkdir -p .git/hooks && printf '#!/nonexistent/interp\n' > .git/hooks/pre-commit.legacy && chmod +x .git/hooks/pre-commit.legacy
  - tool: [hook-impl, --config=.pre-commit-config.yaml, --hook-type=pre-commit, --hook-dir, "${work}/.git/hooks", --]
  - shell: rm .git/hooks/pre-commit.legacy && mkdir .git/hooks/pre-commit.legacy
  - tool: [hook-impl, --config=.pre-commit-config.yaml, --hook-type=pre-commit, --hook-dir, "${work}/.git/hooks", --]
compare:
  stdout: tierB
