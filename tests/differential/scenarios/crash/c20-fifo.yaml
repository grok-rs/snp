name: crash/c20-fifo
description: '13 X.10 c20 — a FIFO passed via --files hangs pre-commit (X13-CLS-03)'
covers: [X13-CLS-03]
tags: [crash-recipe]
requires: {os: [linux, macos]}
expect_divergence: D-CRASH-09
work:
  fifos: [ff]
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: all, name: all files, entry: echo, language: system}
steps:
  - tool: [run, --files, ff]
    timeout: 5s
