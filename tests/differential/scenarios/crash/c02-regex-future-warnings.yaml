name: crash/c02-regex-future-warnings
description: '13 X.10 c02 — FutureWarning patterns, also under PYTHONWARNINGS (X13-CFG-08, X13-SM-03, X13-SM-10)'
covers: [X13-CFG-08, X13-SM-03, X13-SM-10]
tags: [crash-recipe]
expect_divergence: D-MISC-04
work:
  files: {a.txt: ""}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: h, name: h, entry: 'true', language: system, files: "[[]", exclude: "[a&&b]"}
        -   {id: h2, name: h2, entry: 'true', language: system, files: "[[]", exclude: "[a||b]"}
  commit: [.pre-commit-config.yaml, a.txt]
steps:
  - tool: [validate-config, .pre-commit-config.yaml]
  - tool: [run, -a]
  - tool: [validate-config, .pre-commit-config.yaml]
    env: {PYTHONWARNINGS: ignore}
compare:
  stderr: tierB
