name: crash/c11-hazmat-cli
description: '13 X.10 c11 — hazmat failures on the command line (X13-HZ-02..05)'
covers: [X13-HZ-02, X13-HZ-03, X13-HZ-04, X13-HZ-05]
tags: [crash-recipe]
work:
  files: {sub/s.txt: ""}
  config: "repos: []\n"
  commit: [.pre-commit-config.yaml, sub/s.txt]
steps:
  - tool: [hazmat, n1, nonexistent-exe, --]
  - tool: [hazmat, ignore-exit-code]
  - tool: [hazmat, n1, --]
  - tool: [hazmat, cd, sub, --]
  - tool: [hazmat, cd, nodir, echo, --]
  - tool: [hazmat, n1, echo]
compare:
  stdout: tierB
  stderr: tierB
