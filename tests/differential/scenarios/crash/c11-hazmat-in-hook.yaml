name: crash/c11-hazmat-in-hook
description: '13 X.10 c11 — hazmat failures inside hook entries (X13-HZ-06)'
covers: [X13-HZ-06]
tags: [crash-recipe]
expect_divergence: D-MISC-07
work:
  files: {sub/s.txt: ""}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: a, name: n1 missing, entry: pre-commit hazmat n1 nonexistent-exe --, language: system}
        -   {id: b, name: cd missing, entry: pre-commit hazmat cd nodir echo --, language: system}
        -   {id: c, name: ignore empty, entry: pre-commit hazmat ignore-exit-code, language: system}
  commit: [.pre-commit-config.yaml, sub/s.txt]
steps:
  - tool: [run, -a]
compare:
  # Tier C: Tier B would reduce the traceback to its last line and hide the listed divergence
  stdout: exact
