name: platform/w12-conpty-bytes
description: '14 §A.6.4 W12 — invalid UTF-8 and `é` printed by a hook under ConPTY'
tags: [platform]
requires: {os: [windows], console: conpty, probe: true}
work:
  files: {a.txt: ""}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: b, name: bytes, entry: "${probe} bytes fffe206f6bc3a9", language: system, verbose: true, pass_filenames: false}
  commit: [.pre-commit-config.yaml, a.txt]
steps:
  - tool: [run, -a]
