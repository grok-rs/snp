name: try-repo/t10-try-05-06-uncommitted
covers: [T10-TRY-05, T10-TRY-06]
repos:
  hooks:
    fixture: script_hooks_repo
    then:
      - shell: |
            sed 's/name: Bash hook/name: modified name!/' .pre-commit-hooks.yaml > m && mv m .pre-commit-hooks.yaml
      - write: {staged.txt: "s\n"}
      - git: [add, staged.txt]
work:
  files: {test-file: ""}
  config: null
  stage: [test-file]
steps:
  - tool: [try-repo, "${repo:hooks}"]
compare:
  stdout: tierB
