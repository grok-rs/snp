name: install/t10-ins-08-worktree
covers: [T10-INS-08]
repos:
  hooks: {fixture: script_hooks_repo}
work:
  config: |
    repos:
    -   repo: ${repo:hooks}
        rev: ${rev:hooks}
        hooks: [{id: bash_hook}]
  commit: [.pre-commit-config.yaml]
  setup:
    - git: [branch, -m, notmaster]
    - git: [worktree, add, -q, "${root}/wt", -b, master]
steps:
  - tool: [install]
    cwd: ../wt
  - shell: cd ../wt && touch foo && git add foo && git commit -m commit!
  - shell: ls .git/hooks | grep -v sample
compare:
  hooks_dir: true
