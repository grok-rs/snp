name: install/t10-ins-16-binary-hook
covers: [T10-INS-16, T10-INS-21]
work:
  config: "repos: []\n"
  setup:
    - shell: mkdir -p .git/hooks && printf '\240\357\022\362' > .git/hooks/pre-commit && printf '#!/bin/sh\necho 1\n' > .git/hooks/pre-push && chmod +x .git/hooks/pre-push
steps:
  - tool: [uninstall, -t, pre-push]
  - tool: [install]
  - shell: ls .git/hooks | grep -v sample
compare:
  hooks_dir: true
