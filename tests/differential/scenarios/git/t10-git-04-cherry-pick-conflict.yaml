name: git/t10-git-04-cherry-pick-conflict
covers: [T10-GIT-04]
work:
  files: {f: "base\n"}
  config: |
    repos:
    -   repo: local
        hooks:
        -   {id: show, name: show, entry: echo, language: system, verbose: true}
  commit: [.pre-commit-config.yaml, f]
  setup:
    - git: [checkout, -q, -b, other]
    - write: {f: "other\n"}
    - commit: other
    - git: [checkout, -q, "-"]
    - write: {f: "mine\n"}
    - commit: mine
    - shell: git cherry-pick other >/dev/null 2>&1 || true
steps:
  - tool: [run]
