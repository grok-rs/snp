# Performance and memory budgets enforced by `cargo xtask bench gate` (ARCHITECTURE §12.1, §12.3; ADR-043, ADR-071,
# ADR-079). Owned by WP-36. Every number here is normative: changing one is a reviewed change of a budget.
#
# Units: times in milliseconds (the hyperfine median of `-N -w 5 -r 50`), memory in MiB (RSS: the median of 10
# `/usr/bin/time` runs; allocations: dhat's total bytes allocated), syscalls as counted by `strace -f -c`.
# ARCHITECTURE §12.1 states the memory budgets in MB (10^6 bytes); they are written here as the MiB value of exactly
# that many MB, rounded down (30 MB = 28.61 MiB, 25 MB = 23.84 MiB, 2 MB = 1.907 MiB), so no limit is looser than
# the specification.

[gate]
# A median regression above this percentage fails the gate when the 95 % confidence intervals of the two medians do
# not overlap (distribution-free order-statistic intervals).
regression_pct = 5.0
# ... and by at least this many milliseconds. Two measurements on one runner differ by up to 0.045 ms however good the
# binary (22 CI runs, 2026-11; that +5.8 % at B1's 0.8 ms failed a version bump), so a percentage alone has no margin on
# a sub-millisecond scenario. From 2 ms up the percentage is the stricter of the two (ADR-090).
regression_min_ms = 0.1
# snp's p50 must never be slower than these tools on any scenario both measured (ARCHITECTURE §12.1).
never_slower_than = ["pre-commit", "prek"]

# The ADR-079 musl allocator decision applied to the release artifacts ("system" or "mimalloc"); `bench gate` holds
# the musl record of this allocator to the same never-slower rule. See bench/musl-allocator.md.
[musl]
adopted = "system"

# ---------------------------------------------------------------------------------------------------------------
# Budgets. `metric`: median_ms | rss_mib | syscalls | alloc_mib. Without `vs_*` the limit is `max`; with
# `vs_tool = T` it is `max ×` T's value of the same metric on the same scenario; with `vs_scenario = S` it is
# `max ×` snp's value on S; `plus` is added to a relative limit. `hard = true` fails the gate, otherwise the breach is
# reported (and shown in the PR comment) without failing. `os` is linux | macos | windows.
# ---------------------------------------------------------------------------------------------------------------

# --- Linux x86_64 (the reference runner; the hard gates of ADR-043) -------------------------------------------
[[budget]]
os = "linux"
scenario = "B1"
metric = "median_ms"
max = 3.0
hard = true

[[budget]]
os = "linux"
scenario = "B2"
metric = "median_ms"
max = 10.0
hard = true

[[budget]]
os = "linux"
scenario = "B3"
metric = "median_ms"
max = 25.0
hard = true

[[budget]]
os = "linux"
scenario = "B4"
metric = "median_ms"
vs_tool = "pre-commit"
max = 0.2 # >= 5x faster than pre-commit
hard = false

[[budget]]
os = "linux"
scenario = "B5"
metric = "median_ms"
vs_scenario = "B4"
max = 1.3
hard = false

[[budget]]
os = "linux"
scenario = "B6"
metric = "median_ms"
max = 60.0
hard = false

[[budget]]
os = "linux"
scenario = "B7"
metric = "median_ms"
max = 1000.0
hard = false

[[budget]]
os = "linux"
scenario = "B8"
metric = "rss_mib"
vs_scenario = "B3"
max = 1.0
plus = 1.907 # the streamed patch: B3's RSS + <= 2 MB
hard = false

[[budget]]
os = "linux"
scenario = "B9"
metric = "median_ms"
vs_scenario = "B3"
max = 1.0
plus = 3.0 # B3 + 3 ms
hard = false

[[budget]]
os = "linux"
scenario = "B10"
metric = "median_ms"
max = 50.0
hard = false

[[budget]]
os = "linux"
scenario = "B11"
metric = "median_ms"
max = 1000.0
hard = false

# B12: peak RSS of B4 (50 k files) and B6, plus the ADR-079 regex-cache case B12u (20 Unicode patterns, SNP_JOBS=32,
# non-ASCII paths).
[[budget]]
os = "linux"
scenario = "B4"
metric = "rss_mib"
max = 28.61 # 30 MB
hard = true

[[budget]]
os = "linux"
scenario = "B6"
metric = "rss_mib"
max = 23.84 # 25 MB
hard = true

[[budget]]
os = "linux"
scenario = "B12u"
metric = "rss_mib"
max = 28.61 # 30 MB
hard = true

# Nightly: syscall ceilings (`strace -f -c`) and the allocation budget (feature `dhat-heap`).
[[budget]]
os = "linux"
scenario = "B1"
metric = "syscalls"
max = 64.0
hard = true

# B3's ceiling counts the whole tree under `strace -f`: snp, its 8 git children and the 10 hook processes. Measured on
# the dist build after integration (ADR-083): 3842-3845 syscalls in three runs (Linux 7.0, glibc 2.39, git 2.43);
# the ceiling is that value + ~10 % headroom.
[[budget]]
os = "linux"
scenario = "B3"
metric = "syscalls"
max = 4230.0
hard = true

[[budget]]
os = "linux"
scenario = "B3"
metric = "alloc_mib"
max = 1.907 # 2 MB
hard = true

# --- macOS arm64 (soft) --------------------------------------------------------------------------------------
[[budget]]
os = "macos"
scenario = "B1"
metric = "median_ms"
max = 5.0
hard = false

[[budget]]
os = "macos"
