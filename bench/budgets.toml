# --- Windows x64 (soft ratios to pre-commit: every hook's `git diff` stays a real spawn, ADR-043) -----------------
[[budget]]
os = "windows"
scenario = "B1"
metric = "median_ms"
max = 15.0
hard = false

[[budget]]
os = "windows"
scenario = "B2"
metric = "median_ms"
vs_tool = "pre-commit"
max = 0.4
hard = false

[[budget]]
os = "windows"
scenario = "B3"
metric = "median_ms"
vs_tool = "pre-commit"
max = 0.5
hard = false

# ---------------------------------------------------------------------------------------------------------------
# Micro thresholds (`cargo xtask bench gate --micro`): the exact targets stated by the W1/W2 acceptance lists, whose
# release-mode `perf_*` tests only catch a 3x regression (ADR-071). `id` is the criterion benchmark id of
# crates/snp/benches; the statistic is criterion's median estimate. `max_ns` bounds the time per iteration,
# `min_per_sec` the throughput (the benchmark's declared elements per second). A threshold whose benchmark has no
# result fails the gate.
# ---------------------------------------------------------------------------------------------------------------
[[micro]]
id = "argparse/hook_impl_cli_compat"
max_ns = 5000.0
source = "WP-12: hook-impl argv parse < 5 µs (12 §A.17 item 8)"

[[micro]]
id = "argparse/hook_impl_cli_snp"
max_ns = 5000.0
source = "WP-12: hook-impl argv parse < 5 µs, snp brand"

[[micro]]
id = "pyre_tier1/typical_12x100k"
min_per_sec = 1000000.0
source = "WP-13: tier-1 path searches >= 1,000,000/s"

[[micro]]
id = "classify/50k_files_10_filters"
max_ns = 40000000.0
source = "WP-22: classification of 50 k files with 10 typical filters <= 40 ms"
# 50 k lstat calls: the 4-vCPU shared runners measure 44-52 ms where the reference machine measures 29 ms. Hard with
# `--reference` (the reference machine), a warning elsewhere (ADR-086).
reference_only = true

[[micro]]
id = "yaml/alias_bomb_10x10_rejected"
max_ns = 100000000.0
source = "WP-14: the 10 x 10 alias bomb is a limit error in < 100 ms"

[[micro]]
id = "yaml/deep_nesting_10000_rejected"
max_ns = 100000000.0
source = "WP-14: nesting depth 10,000 is a clean YAML error in < 100 ms"

# ---------------------------------------------------------------------------------------------------------------
# Known misses (ADR-091): checks that fail today for a recorded reason. Each warns, with its reason, instead of
# failing; a check not listed here still fails, and getting worse still fails the regression check. `check` is the
# start of the check's name. The gate says when an entry passes and can go. Removing an entry is the goal: adding one
# is a reviewed decision to accept a miss, not a way to get CI green.
# ---------------------------------------------------------------------------------------------------------------
[[known_miss]]
scenario = "B2"
check = "p50 <= 10 ms"
reason = "seven git processes (parity and stash-safety checks): 7.9-10.7 ms across CI runner VMs, 16 ms on slower machines"

[[known_miss]]
scenario = "B2"
check = "p50 <= prek"
reason = "seven git processes (parity and stash-safety checks); prek spawns fewer"

[[known_miss]]
scenario = "B6"
check = "p50 <= prek"
reason = "not profiled yet (17-26 % behind prek on CI, more on musl)"

[[known_miss]]
scenario = "B8"
check = "p50 <= pre-commit"
reason = "the patch is computed twice to re-verify it before the checkout (ADR-067, deferred by ADR-084)"

[[known_miss]]
scenario = "B8"
check = "p50 <= prek"
reason = "the patch is computed twice to re-verify it before the checkout (ADR-067, deferred by ADR-084)"

[[known_miss]]
scenario = "B11"
check = "p50 <= prek"
reason = "may not be like for like: prek reports nothing to clean, snp walks 500 repos and 200 configs"

[[known_miss]]
scenario = "B4"
check = "p50 <= prek"
reason = "not profiled yet (4-20 % behind prek on CI, the most on musl)"

[[known_miss]]
scenario = "B5"
check = "p50 <= prek"
reason = "not profiled yet (3 % behind prek on CI, within runner variation)"

[[known_miss]]
scenario = "B12u"
check = "p50 <= prek"
reason = "not profiled yet (6-18 % behind prek on CI, the most on musl)"
