# cargo-dist configuration of the snp release (WBS WP-37; ADR-049, ADR-061; ARCHITECTURE §11.7; 07 §3.17).
#
# `.github/workflows/release.yml` is maintained by hand in dist's layout (sibling checkouts of the user crates at the
# deps.lock commits, the ADR-061 release gates, the snp-cli wheels), hence `allow-dirty = ["ci"]`: never let
# `dist init`/`dist generate` overwrite it.
#
# Only the `snp` package is released (`packages`, plus `dist = true` in its manifest: dist skips the `publish = false`
# inherited from the workspace otherwise);
# every other binary of the workspace (xtask, snp-probe) is tooling and stays out of the release.

[workspace]
members = ["cargo:."]

[dist]
# The dist version CI installs (the release workflow downloads exactly this version).
cargo-dist-version = "0.32.0"
ci = "github"
packages = ["snp"]
allow-dirty = ["ci"]
# Only read by dist's generated workflow; release.yml is maintained by hand (`allow-dirty`), so this has no effect
# there: a pull request that touches the release configuration runs the gates, `dist plan`, every build and every
# wheel, and publishes nothing. Kept at dist's default for `dist generate --check`-style tooling.
pr-run-mode = "plan"
hosting = "github"
# ADR-049: shell and PowerShell installers that install `snp` only. `bin-aliases` is deliberately not configured: it
# would create a `pre-commit` link unconditionally and silently shadow Python pre-commit. The alias is opt-in
# (`snp self alias install`).
installers = ["shell", "powershell"]
install-path = "CARGO_HOME"
install-updater = false
# Linux gnu/musl x x86_64/arm64, macOS x 2, Windows msvc x 2 (14 §A.5.1).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
# Windows binaries link the CRT statically (no VC++ redistributable needed, 14 §A.5.1).
msvc-crt-static = true
# ARCHITECTURE §11.7: dependency list embedded in every binary, a CycloneDX SBOM per package, SHA-256 checksums for
# every asset, GitHub artifact attestations.
cargo-auditable = true
cargo-cyclonedx = true
checksum = "sha256"
github-attestations = true
# One `cargo build` per target, with exactly the release profile of the root manifest (`[profile.dist]`).
precise-builds = true
unix-archive = ".tar.xz"
windows-archive = ".zip"
# README.md, LICENSE and CHANGELOG.md are detected and shipped in every archive; the GitHub release notes are the
# `## [X.Y.Z]` section of CHANGELOG.md, the same section `cargo xtask release notes` prints.

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-arm"
