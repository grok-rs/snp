[package]
name = "snp-pycompat-proto"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Reference prototype of snp's Python-stdlib semantics shims, verified against CPython 3.12 golden vectors"

[lib]
path = "src/lib.rs"

[dependencies]
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
serde_json = "1.0.149"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
