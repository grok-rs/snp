<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">snp — You Shell Not Pass</title>
  <desc id="d">A wizard with a glowing staff stands on a narrow bridge, blocking a broken commit. A shell prompt glows at the staff's tip.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="1" stop-color="#3a1c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffd54a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="640" height="320" rx="24" fill="url(#sky)"/>
  <!-- chasm fire -->
  <rect x="0" y="230" width="640" height="90" rx="0" fill="url(#fire)" opacity="0.55"/>

  <!-- the bridge -->
  <path d="M20 236 H340 L332 248 H28 Z" fill="#0d0b14"/>

  <!-- the broken commit trying to cross (left), stopped -->
  <g transform="translate(70 196)">
    <rect width="78" height="40" rx="6" fill="#2a2140" stroke="#ff6b6b" stroke-width="2"/>
    <text x="39" y="17" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#ff8f8f" text-anchor="middle">commit</text>
    <text x="39" y="32" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#ff8f8f" text-anchor="middle">✗ lint</text>
  </g>

  <!-- wizard silhouette -->
  <g fill="#0d0b14">
    <!-- hat -->
    <path d="M250 70 L232 126 H268 Z"/>
    <path d="M222 126 Q250 118 278 126 L276 132 Q250 126 224 132 Z"/>
    <!-- head + beard -->
    <circle cx="250" cy="140" r="11"/>
    <path d="M240 144 Q250 178 260 144 Z"/>
    <!-- robe -->
    <path d="M236 150 Q226 196 214 236 H286 Q274 196 264 150 Q250 158 236 150 Z"/>
    <!-- raised arm holding staff -->
    <path d="M262 160 L292 128 L297 133 L268 166 Z"/>
  </g>
  <!-- staff -->
  <line x1="300" y1="98" x2="300" y2="236" stroke="#0d0b14" stroke-width="5" stroke-linecap="round"/>
  <!-- glowing tip: a shell prompt -->
  <circle cx="300" cy="92" r="34" fill="url(#glow)"/>
  <text x="300" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#2a1a00" text-anchor="middle">&gt;_</text>

  <!-- wordmark -->
  <text x="358" y="150" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="84" font-weight="800" fill="#ffd54a" letter-spacing="2">snp</text>
  <text x="360" y="188" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="22" fill="#f4ecff">You Shell Not Pass</text>
  <text x="360" y="214" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#b9a9d9">git hooks · pre-commit drop-in · Rust</text>
</svg>
