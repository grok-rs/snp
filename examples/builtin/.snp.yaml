# snp only: `repo: builtin` hooks are pre-commit-hooks v6.0.0 compiled into snp.
# No `rev`, no clone, no Python fallback. pre-commit rejects `repo: builtin`, so this file
# is named .snp.yaml, which snp finds before .pre-commit-config.yaml and pre-commit never reads.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        files: ^config/.*\.json$

  # The hooks that need CPython's parser have no builtin: keep them upstream, with a rev.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
