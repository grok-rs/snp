# A Python project: generic file checks, ruff (lint + format) and mypy.
# Valid for pre-commit 4.7.0 and snp alike; no snp extension is used.
default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements          # needs CPython's parser: snp runs the real Python hook
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Prefer black over ruff-format? Replace the ruff-format hook above with:
  #
  # - repo: https://github.com/psf/black-pre-commit-mirror
  #   rev: 26.10.1
  #   hooks:
  #     - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        exclude: ^(docs|tests/fixtures)/
        additional_dependencies: [types-requests]
