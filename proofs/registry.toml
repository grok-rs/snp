# Verified kernels, Lean models and trusted items: the single machine-readable source of ADR-095
# (docs/VERIFICATION.md §3.1). `cargo xtask proofs check` (G1-G10) keeps it, the kernel markers and the mounts of
# proofs/verus/kernels.rs in agreement; `cargo xtask proofs verus` (V1-V4) and `mutants` read it too.

[verus]
version = "0.2026.11.02.8bf68ee"   # bundles rust_verify, Z3 4.16.0 and the prebuilt vstd
rustc = "1.99.1"                   # from the zip's version.json; never the rustup default
# sha256 of the release zip `verus-<version>-<platform>.zip` (github.com/verus-lang/verus/releases). Only the
# platform CI and the owner use is pinned; add others when a contributor needs them.
sha256 = { x86-linux = "f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c" }
# sha256 of `verusfmt-<target>.tar.xz` (github.com/verus-lang/verusfmt/releases).
verusfmt = { version = "0.7.4", sha256 = { x86_64-unknown-linux-gnu = "bbc5cb02c01efeaf9e66c93443ae782b11c5d8fd88c67d558c23216222971f4f" } }

# One entry per kernel file (rule K1 of §2.3). `mount` is the module name in proofs/verus/kernels.rs;
# `verified_min` is the number of items Verus reports verified for this kernel's mount, spec and the lib lemmas it
# brought (measured when the entry was added); a whole-root run must verify at least the sum over all kernels.
# Every mutant, applied to a temporary copy of `file` (first occurrence of `find`), must make verification fail
# (V3; `cargo xtask proofs mutants`).
[[kernel]]
id = "K1-xargs-partition"
status = "verified"                # verified | pending (§8.3)
file = "crates/snp-proc/src/xargs/partition.rs"
mount = "snp_proc_xargs_partition"
spec = "proofs/verus/spec/xargs_partition.rs"
callers = ["crates/snp-proc/src/xargs.rs::partition"]
verified_min = 10
mutants = [
    { find = "Some(t) => t <= max_len", replace = "Some(t) => t < max_len" },
    # F2: the former saturating budget accepts an argument whose length overflows the sum.
    { find = "match total.checked_add(arg_len) {", replace = "match Some(total.saturating_add(arg_len)) {" },
]

[[kernel]]
id = "K2-archive-entry"
status = "verified"
file = "crates/snp-net/src/archive/entry.rs"
mount = "snp_net_archive_entry"
spec = "proofs/verus/spec/archive_entry.rs"
callers = ["crates/snp-net/src/archive/path.rs::entry_path"]
verified_min = 16
mutants = [
    # Accepts a `..` component (the ADR-077 escape).
    { find = "return Err(Refusal::DotDot);", replace = "return Ok(true);" },
    # Lets a NUL byte through in the first position.
    { find = "if b == 0 {", replace = "if b == 0 && i > 0 {" },
    # Forgets `\` as a separator when `windows`.
    { find = "(windows && b == ", replace = "(false && b == " },
    # Forgets `\x` as a rooted name.
    { find = "if c0 == b'/' || c0 ==", replace = "if c0 == b'/' || false && c0 ==" },
    # Spec mutants of the `..` branch of `norm_step` (lemma_normpath_dotdot): `..` always pushed, `..` clears all.
    { file = "proofs/verus/spec/archive_entry.rs", find = "if stack.len() > 0 && !is_dotdot(stack.last()) {", replace = "if false {" },
    { file = "proofs/verus/spec/archive_entry.rs", find = "            stack.drop_last()\n", replace = "            Seq::<Seq<u8>>::empty()\n" },
]

[[kernel]]
id = "K3-end-of-file-fixer"
status = "verified"
file = "crates/snp-hooks/src/pch/p0/kernels/eof.rs"
mount = "snp_hooks_pch_p0_kernels_eof"
spec = "proofs/verus/spec/eof.rs"
callers = ["crates/snp-hooks/src/pch/p0/end_of_file_fixer.rs::tail_action"]
verified_min = 14
mutants = [
    # A file made only of line endings is no longer emptied (`fix_file`'s `tell() == 1` branch).
    { find = "if run >= len {", replace = "if run > len {" },
    # The trailing run stops at the first `\r`, so `a\n\r` keeps its `\r`.
    { find = "Some(&b) if is_eol(b) => start = i,", replace = "Some(&b) if b == 10 => start = i," },
]

[[kernel]]
id = "K5a-zsplit"
status = "verified"
file = "crates/snp-pycompat/src/precommit/zsplit.rs"
mount = "snp_pycompat_precommit_zsplit"
spec = "proofs/verus/spec/zsplit.rs"
callers = ["crates/snp-pycompat/src/precommit.rs::zsplit", "crates/snp-pycompat/src/precommit.rs::ZSplit::next"]
verified_min = 19
mutants = [
    # The strip treats `\x01` as the NUL to strip.
    { find = "b.get(start) == Some(&0)", replace = "b.get(start) == Some(&1)" },
    # A single-byte record after stripping is dropped.
    { find = "if start == end {", replace = "if start >= end.saturating_sub(1) {" },
    # The NUL search reports the byte after the NUL.
    { find = "return Some(i);", replace = "return Some(i.saturating_add(1));" },
    # Spec mutant: the record after a NUL keeps the NUL (`lemma_split_win_join`, `lemma_split_win_nul_free`).
    { file = "proofs/verus/spec/zsplit.rs", find = "seq![b.subrange(st, j)] + split_win(b, j + 1, j + 1, hi)", replace = "seq![b.subrange(st, j)] + split_win(b, j, j + 1, hi)" },
]

[[kernel]]
id = "K5b-zlist-split"
status = "verified"
file = "crates/snp-git/src/zlist/split.rs"
mount = "snp_git_zlist_split"
spec = "proofs/verus/spec/zlist_split.rs"
callers = ["crates/snp-git/src/zlist.rs::ZList::split"]
verified_min = 12
mutants = [
    # `from_z` deduplicates too.
    { find = "let keep = !dedup || spans.is_empty()", replace = "let keep = spans.is_empty()" },
    # A buffer over 64 KiB is refused as too large.
    { find = "u32::try_from(n)", replace = "u16::try_from(n)" },
    # The dedup comparison ignores the first byte.
    { find = "if buf[xs + i] != buf[ys + i] {", replace = "if buf[xs + i] != buf[ys + i] && i > 0 {" },
    # The scalar finder skips the byte at `from`.
    { find = "let mut i = from;", replace = "let mut i = from.saturating_add(1);" },
]

[[kernel]]
id = "K6-eof-tail-fold"
status = "verified"
file = "crates/snp-hooks/src/pch/p0/kernels/eof_tail.rs"
mount = "snp_hooks_pch_p0_kernels_eof_tail"
spec = "proofs/verus/spec/eof_tail.rs"
callers = ["crates/snp-hooks/src/pch/p0/end_of_file_fixer.rs::tail_action"]
verified_min = 9
mutants = [
    # The block's run stops at the first `\r`, so a block ending in `\n\r` folds a run of one.
    { find = "Some(&b) if is_eol(b) => start = i,", replace = "Some(&b) if b == 10 => start = i," },
    # The old head is kept when the block adds one byte (the new byte is not prepended).
    { find = "([b0, st.head[0]], 2)", replace = "(st.head, old_len)" },
    # `done` after any block: the scan stops before the run is complete.
    { find = "        start > 0,\n    )", replace = "        true,\n    )" },
    # Blocks overlap by one byte (start one too low).
    { find = "let start = from.saturating_sub(size);", replace = "let start = from.saturating_sub(size).saturating_sub(1);" },
    # Spec mutant: the fold appends the old head before the block's run.
    { file = "proofs/verus/spec/eof_tail.rs", find = "take2(tail_run(b) + h)", replace = "take2(h + tail_run(b))" },
]

[[kernel]]
id = "K7-pathspec-lists"
status = "verified"
file = "crates/snp-git/src/git/pathspec.rs"
mount = "snp_git_git_pathspec"
spec = "proofs/verus/spec/pathspec.rs"
callers = [
    "crates/snp-git/src/git.rs::parse_numstat_z",
    "crates/snp-git/src/git.rs::literal_pathspecs",
    "crates/snp-git/src/git.rs::checkout_path_calls",
    "crates/snp-git/src/git.rs::rollback_paths",
]
verified_min = 54
mutants = [
    # F3: the sink lets an empty path through (an empty `:(literal)` checks out the whole tree).
    { find = "if p.is_empty() || has_nul(p) {", replace = "if has_nul(p) {" },
    # F3: an empty record of the changed-path listing reaches the rollback list.
    { find = "if !p.is_empty() {", replace = "if true {" },
    # N2: an empty path after the second TAB is returned instead of starting a rename record.
    { find = "if start < k {", replace = "if start <= k {" },
    # N1: the path starts after the first TAB, so the deleted count leaks into the name.
    { find = "find_tab(out, t1.saturating_add(1), k)", replace = "find_tab(out, t1, k)" },
    # N3: a chunk is closed one byte early (no longer greedy).
    { find = "Some(u) => u > budget,", replace = "Some(u) => u >= budget," },
    # The verified SeenSet reports a repeated record as fresh.
    { find = "mask.push(!seen_before);", replace = "mask.push(true);" },
    # Spec mutant: `drop_empty` keeps empty records, so the rollback contract no longer matches the code.
    { file = "proofs/verus/spec/pathspec.rs", find = "} else if xs.last().len() == 0 {", replace = "} else if false {" },
]

# [[model]]: Lean models with fingerprinted anchors: oracle tests (K3, K4) or, for a protocol model, named witnesses (K9).
# [[trusted]]: production impls of kernel traits (§2.6, §10 row 8), each with its differential test (G8).

[[model]]
id = "K3-end-of-file-fixer"
lean = "proofs/lean/SnpModels/Eof.lean"
theorems = [
    "SnpModels.Eof.pyFixFile_eq",
    "SnpModels.Eof.kernel_apply",
    "SnpModels.Eof.fix_idem",
    "SnpModels.Eof.fix_body",
    "SnpModels.Eof.pyFixFile_twice",
]
oracle = "eof-model"
oracle_test = "crates/snp-hooks/tests/lean_oracle.rs"
# The oracle driver (proofs/lean/EofMain.lean) and the oracle test are trust points: any edit asks for a re-review
# (`cargo xtask proofs fingerprint <file>`, G10).
driver_fingerprint = "1acfebe5b9966dcd"
oracle_test_fingerprint = "e4017b3d13ff06bd"
# fingerprint: `cargo xtask proofs fingerprint <file.rs::item>` (§3.1, G10). `kernelRun` in Eof.lean
# transliterates `end_of_file_run`, `kernel` the whole-file `end_of_file` (with `is_eol`); the oracle test calls
# `end_of_file_bytes`.
anchors = [
    { item = "crates/snp-hooks/src/pch/p0/kernels/eof.rs::end_of_file_run", fingerprint = "450ba6b0d698d9c2" },
    { item = "crates/snp-hooks/src/pch/p0/kernels/eof.rs::end_of_file", fingerprint = "81448e4d8ba287b6" },
    { item = "crates/snp-hooks/src/pch/p0/kernels/eof.rs::is_eol", fingerprint = "1ec1e575101fc612" },
    { item = "crates/snp-hooks/src/pch/p0/kernels/eof.rs::end_of_file_bytes", fingerprint = "7a11e1bbaf64dfd4" },
]
# L5 (`cargo xtask proofs lean`): fingerprint of each theorem's statement and of every model definition it reaches
# (never a proof); a change prints the new value. Lean upgrades change them too: re-review, then refresh.
[model.statements]
"SnpModels.Eof.pyFixFile_eq" = "c30752f13fe18854"
"SnpModels.Eof.kernel_apply" = "37978ca884d2591c"
"SnpModels.Eof.fix_idem" = "6f65ed378938e8d5"
"SnpModels.Eof.fix_body" = "5dd9c663de5fbe04"
"SnpModels.Eof.pyFixFile_twice" = "1536400bcf2c674b"

[[model]]
id = "K4-shlex-split"
lean = "proofs/lean/SnpModels/Shlex.lean"
theorems = ["SnpModels.Shlex.pySplit_eq_split", "SnpModels.Shlex.split_quote", "SnpModels.Shlex.split_join"]
oracle = "shlex-model"
oracle_test = "crates/snp-pycompat/tests/lean_oracle.rs"
driver_fingerprint = "af906ff552d63f5c"
oracle_test_fingerprint = "a54309f336092389"
# fingerprint: `cargo xtask proofs fingerprint <file.rs::item>` (§3.1, G10). The helpers `split` and `quote` call
# (`is_ws`, `St`, `Esc`, `is_safe`, `quote_bytes`) are anchored too: an anchor hashes its own item only.
anchors = [
    { item = "crates/snp-pycompat/src/shlex.rs::split", fingerprint = "71f6ef5a43be5b96" },
    { item = "crates/snp-pycompat/src/shlex.rs::quote", fingerprint = "00a8f6564f6491e1" },
    { item = "crates/snp-pycompat/src/shlex.rs::join", fingerprint = "8e2d42c5e4ce29b1" },
    { item = "crates/snp-pycompat/src/shlex.rs::is_ws", fingerprint = "d94f06c56190310a" },
    { item = "crates/snp-pycompat/src/shlex.rs::St", fingerprint = "f55e6abc0db7e0e7" },
    { item = "crates/snp-pycompat/src/shlex.rs::Esc", fingerprint = "bd7630144abb5859" },
    { item = "crates/snp-pycompat/src/shlex.rs::is_safe", fingerprint = "b7ec02e51135e6f3" },
    { item = "crates/snp-pycompat/src/shlex.rs::quote_bytes", fingerprint = "939a1fcd4c229284" },
]
[model.statements]
"SnpModels.Shlex.pySplit_eq_split" = "67a279bf3ae4866e"
"SnpModels.Shlex.split_quote" = "4ab0fa788ac59903"
"SnpModels.Shlex.split_join" = "c86111f19da7c967"

# K9: a protocol model (Lean only, docs/VERIFICATION.md §9.2). No oracle: nothing executable is compared; the
# behaviour tests below exercise the modelled scenarios against real git (named witnesses, not a proof link). The
# anchors pin the guard.rs steps and the snp-git calls the model describes; A1-A5 are fields of `Hyps`, not axioms.
[[model]]
id = "K9-stash-protocol"
lean = "proofs/lean/SnpModels/Stash/Protocol.lean"
theorems = [
    "SnpModels.Stash.roundtrip",
    "SnpModels.Stash.roundtrip_exact",
    "SnpModels.Stash.residual_loss",
    "SnpModels.Stash.precommit_loses_filter_hidden_change",
    "SnpModels.Stash.precommit_loses_assume_unchanged_edit",
    "SnpModels.Stash.rollback_complete",
    "SnpModels.Stash.no_silent_loss",
    "SnpModels.Stash.index_invariant",
]
witnesses = [
    "crates/snp-stash/tests/behaviour/hidden.rs::a_change_a_clean_filter_hides_survives_the_stash",
    "crates/snp-stash/tests/behaviour/hidden.rs::the_conflict_rollback_keeps_a_hidden_change_and_discards_every_visible_fix",
    "crates/snp-stash/tests/behaviour/hidden.rs::an_assume_unchanged_edit_survives_the_stash",
    "crates/snp-stash/tests/behaviour/hidden.rs::names_are_literal_pathspecs",
]
anchors = [
    { item = "crates/snp-stash/src/guard.rs::enter", fingerprint = "3056f468d1771bce" },
    { item = "crates/snp-stash/src/guard.rs::Inner::stash", fingerprint = "d4804a53d328af23" },
    { item = "crates/snp-stash/src/guard.rs::Inner::stage_fixed", fingerprint = "cec3d73a66bef646" },
    { item = "crates/snp-stash/src/guard.rs::Inner::git_apply", fingerprint = "8cbc686e7d1df3e6" },
    { item = "crates/snp-stash/src/guard.rs::Inner::rollback_checkout", fingerprint = "f8efa048d39e5e99" },
    { item = "crates/snp-stash/src/guard.rs::Inner::restore_patch", fingerprint = "589050b70214ca80" },
    { item = "crates/snp-stash/src/guard.rs::Inner::finish", fingerprint = "ad4d9af3d498fa53" },
    { item = "crates/snp-git/src/git.rs::Git::patch_paths", fingerprint = "189c9aee406d8b09" },
    { item = "crates/snp-git/src/git.rs::Git::changed_paths", fingerprint = "b61db27db0cb3a63" },
    { item = "crates/snp-git/src/git.rs::Git::rollback_paths", fingerprint = "68e261952a4a8281" },
    { item = "crates/snp-git/src/git.rs::Git::checkout_paths", fingerprint = "d187d5caa7744a77" },
    { item = "crates/snp-git/src/git.rs::Git::checkout_path_calls", fingerprint = "85e4464719d5a398" },
]
[model.statements]
"SnpModels.Stash.roundtrip" = "85cff6b6ce4218dc"
"SnpModels.Stash.roundtrip_exact" = "ea1d73c26c8fffbb"
"SnpModels.Stash.residual_loss" = "bb275b5d7e4e9969"
"SnpModels.Stash.precommit_loses_filter_hidden_change" = "fa0e11736d6d35a8"
"SnpModels.Stash.precommit_loses_assume_unchanged_edit" = "c296dcc16bfb4ce6"
"SnpModels.Stash.rollback_complete" = "956df0f2647cbbc1"
"SnpModels.Stash.no_silent_loss" = "6bdf668f701a98f7"
"SnpModels.Stash.index_invariant" = "e0b8ab6a659b7c3b"

# memchr 2.x `memchr(needle, &hay[from..])` shifted by `from`: the first `needle` at or after `from`, the contract of
# `FindByte::find_byte` (K5b). Tested against the verified `Scalar` (and checked by every debug build of
# `ZList::split`).
[[trusted]]
item = "Memchr: FindByte"
kernel = "K5b-zlist-split"
test = "crates/snp-git/src/zlist.rs::memchr_matches_scalar"

# std `HashSet` insert: `first_seen` marks exactly the first occurrence of each record, the contract of `SeenSet`
# (K7). Used above `SCAN_MAX` paths; tested against the verified `Scan` on seeded lists.
[[trusted]]
item = "HashSeen: SeenSet"
kernel = "K7-pathspec-lists"
test = "crates/snp-git/src/git.rs::seen_set_hash_matches_scan"
