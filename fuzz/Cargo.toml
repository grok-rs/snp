# cargo-fuzz crate (ARCHITECTURE §1.1, §13.5): not a member of the snp workspace. WP-00 pre-creates every
# target of §13.5 (one stub file + one [[bin]] entry); the package owning a target's prefix fills the file
# (docs/WBS.md "Disjoint ownership"). Nobody else edits this manifest.
#
#   cargo +nightly fuzz run <target> -- -max_total_time=60 -rss_limit_mb=512   (CI smoke; 300 s nightly)

[package]
name = "snp-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# S1 (ARCHITECTURE §11.6): no `unsafe` in snp code; checked by `cargo xtask check-unsafe`.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
libfuzzer-sys = "0.4.13"
snp-argparse = { path = "../crates/snp-argparse" }
snp-cli = { path = "../crates/snp-cli" }
snp-cmd = { path = "../crates/snp-cmd" }
snp-config = { path = "../crates/snp-config" }
snp-files = { path = "../crates/snp-files" }
snp-git = { path = "../crates/snp-git" }
snp-hooks = { path = "../crates/snp-hooks" }
snp-lang = { path = "../crates/snp-lang" }
snp-migrate = { path = "../crates/snp-migrate" }
snp-net = { path = "../crates/snp-net" }
snp-proc = { path = "../crates/snp-proc" }
snp-pycompat = { path = "../crates/snp-pycompat" }
snp-pyparsers = { path = "../crates/snp-pyparsers" }
snp-pyre = { path = "../crates/snp-pyre" }
snp-stash = { path = "../crates/snp-stash" }
snp-store = { path = "../crates/snp-store" }
snp-yaml = { path = "../crates/snp-yaml" }

# Not part of the snp workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

