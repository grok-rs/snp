[package]
name = "cfgv"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Validate configuration and produce human readable error messages"
license = "MIT"
repository = "https://github.com/grok-rs/cfgv-rs"
keywords = ["configuration", "validation", "schema", "config"]
categories = ["config", "development-tools"]

[dependencies]
indexmap = "2.2"
regex = { version = "1.10", optional = true }
serde = { version = "1.0.200", optional = true }

[dev-dependencies]
proptest = "1.5"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
default = ["regex"]
## `CheckFn::check_regex()` backed by the `regex` crate.
regex = ["dep:regex"]
## `Serialize`/`Deserialize` for `Value` and a `Deserializer` for `&Value`.
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
