[package]
name = "cfgv"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Validate configuration and produce human readable error messages"
license = "MIT"
repository = "https://github.com/grok-rs/cfgv-rs"
keywords = ["configuration", "validation", "schema", "config"]
categories = ["config", "development-tools"]

[dependencies]
indexmap = "2.2"
regex = { version = "1.10", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["regex"]
## `CheckFn::check_regex()` backed by the `regex` crate.
regex = ["dep:regex"]
